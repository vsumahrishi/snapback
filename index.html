    if(em) state.profile.teacherEmail=em;
    saveState();
  }catch(e){ console.warn('saveShareContactsFromForm', e); }
}
function buildStatusUpdateText(){
  try{
    const fromEl=document.getElementById('shareFrom');
    const toEl=document.getElementById('shareTo');
    let from=(fromEl&&fromEl.value)||todayStr();
    let to=(toEl&&toEl.value)||todayStr();
    if(from>to){ const tmp=from; from=to; to=tmp; }
    const wantDone=!(document.getElementById('shareSelDone')) || document.getElementById('shareSelDone').checked;
    const wantOpen=!(document.getElementById('shareSelOpen')) || document.getElementById('shareSelOpen').checked;
    const wantClasses=document.getElementById('shareSelClasses') && document.getElementById('shareSelClasses').checked;
    const name=(state.profile&&state.profile.name)||'';
    const lines=[];
    lines.push('SnapBack update — '+name);
    lines.push('Range: '+from+' to '+to);
    lines.push('');
    const inRange=function(d){
      if(!d) return false;
      return d>=from && d<=to;
    };
    const tasks=(state.tasks||[]);
    if(wantDone){
      const done=tasks.filter(t=>t.done && (inRange(t.date) || inRange(t.completedAt) || (!t.date && t.done)));
      lines.push('Completed tasks ('+done.length+'):');
      if(done.length){
        done.slice(0,40).forEach(t=>{
          lines.push('• '+(t.title||'Untitled')+(t.date?' ('+t.date+')':''));
        });
        if(done.length>40) lines.push('…and '+(done.length-40)+' more');
      } else lines.push('(none in this range)');
      lines.push('');
    }
    if(wantOpen){
      const open=tasks.filter(t=>!t.done && (inRange(t.date) || !t.date));
      // Prefer dated in range; also include undated open tasks as load context
      const openDated=tasks.filter(t=>!t.done && t.date && inRange(t.date));
      const openUndated=tasks.filter(t=>!t.done && !t.date);
      lines.push('Open tasks in range ('+openDated.length+'):');
      if(openDated.length){
        openDated.slice(0,40).forEach(t=>{
          lines.push('• '+(t.title||'Untitled')+' ('+t.date+')');
        });
        if(openDated.length>40) lines.push('…and '+(openDated.length-40)+' more');
      } else lines.push('(none with a due date in this range)');
      if(openUndated.length){
        lines.push('Open tasks without a date ('+openUndated.length+'):');
        openUndated.slice(0,15).forEach(t=>lines.push('• '+(t.title||'Untitled')));
        if(openUndated.length>15) lines.push('…and '+(openUndated.length-15)+' more');
      }
      lines.push('');
    }
    if(wantClasses){
      const classes=(state.classes||[]);
      lines.push('Class load summary:');
      if(!classes.length) lines.push('(no classes saved)');
      else {
        const byDay={};
        classes.forEach(c=>{
          const day=c.day||c.weekday||'Other';
          if(!byDay[day]) byDay[day]=[];
          byDay[day].push((c.name||c.title||'Class')+(c.start?(' '+c.start+(c.end?('–'+c.end):'')) : ''));
        });
        Object.keys(byDay).forEach(day=>{
          lines.push(day+': '+byDay[day].join('; '));
        });
      }
      lines.push('');
    }
    lines.push('— sent from SnapBack');
    return lines.join('\n').trim();
  }catch(e){
    console.warn('buildStatusUpdateText', e);
    return 'SnapBack update (could not build full text).';
  }
}
function markSharePreviewDirty(){
  try{
    const ta=document.getElementById('sharePreview');
    if(ta) ta.dataset.userEdited='1';
  }catch(e){}
}
function clearSharePreviewDirty(){
  try{
    const ta=document.getElementById('sharePreview');
    if(ta) delete ta.dataset.userEdited;
  }catch(e){}
}
function isSharePreviewDirty(){
  try{
    const ta=document.getElementById('sharePreview');
    return !!(ta && ta.dataset.userEdited==='1');
  }catch(e){ return false; }
}
function refreshSharePreview(force){
  try{
    const ta=document.getElementById('sharePreview');
    if(!ta) return;
    // force=true from the Regenerate button; otherwise only fill if empty / not edited
    if(!force && isSharePreviewDirty() && (ta.value||'').trim().length>=5){
      return; // keep user's edits
    }
    if(!force && isSharePreviewDirty()){
      // still dirty but short — allow regenerate only when forced
      return;
    }
    ta.value=buildStatusUpdateText();
    clearSharePreviewDirty();
  }catch(e){ console.warn('refreshSharePreview', e); }
}
function getShareMessage(){
  try{
    const ta=document.getElementById('sharePreview');
    let msg=(ta&&ta.value||'').trim();
    if(!msg || msg.length<5){
      msg=buildStatusUpdateText();
      if(ta){ ta.value=msg; clearSharePreviewDirty(); }
    }
    return msg||'';
  }catch(e){
    console.warn('getShareMessage', e);
    return '';
  }
}

      ev.preventDefault();

  try{ wireTechniqueTaskPicker(); }catch(e){}

    }

      maskR.onchange = function(){ if(maskR.checked) applySharePrivacy(false); };
      maskR.onclick = function(){ applySharePrivacy(false); };
    }
    if(detR){
      detR.onchange = function(){ if(detR.checked) applySharePrivacy(true); };
      detR.onclick = function(){ applySharePrivacy(true); };
    }
    const copySw=document.getElementById('copyShareWeekBtn');
    if(copySw) copySw.onclick = async function(){
      const box=document.getElementById('shareWeekLinkBox');
      const val=box ? (box.value||'') : (state.shareWeekLink||'');
      try{ await navigator.clipboard.writeText(val); showAppMessage('Copied','Link copied.'); }
      catch(e){ if(box){ box.select(); showAppMessage('Copy','Select and copy the link.'); } }
    };
    const natSw=document.getElementById('nativeShareWeekBtn');
    if(natSw) natSw.onclick = async function(){
      const val=state.shareWeekLink||'';
      if(navigator.share){
        try{ await navigator.share({ title:'My availability', url:val }); }catch(e){}
      } else {
        try{ await navigator.clipboard.writeText(val); showAppMessage('Copied','Link copied.'); }catch(e){}
      }
    };
  }catch(e){ console.warn('share wire', e); }

  const _ts=document.getElementById('taskSearchInput');
  const _tsg=document.getElementById('taskSearchGoBtn');
  function _applyTaskSearch(){ state.taskSearch=(_ts&&_ts.value)||''; try{persistRender();}catch(e){try{render();}catch(e2){}} }
  if(_ts) _ts.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); _applyTaskSearch(); } };
  if(_tsg) _tsg.onclick=function(){ _applyTaskSearch(); };
  
    const saveAd=document.getElementById('saveAdminContactBtn');
    if(saveAd) saveAd.onclick=function(){
      if(!state.profile) state.profile={};
      state.profile.name=(document.getElementById('adminContactName')&&document.getElementById('adminContactName').value)||'';
      state.profile.email=(document.getElementById('adminContactEmail')&&document.getElementById('adminContactEmail').value)||'';
      state.profile.phone=(document.getElementById('adminContactPhone')&&document.getElementById('adminContactPhone').value)||'';
      try{ saveState(); }catch(e){}
      upsertAdminUserRecord();
      showAppMessage('Saved', 'Contact stored. Admin can view in Firebase → Firestore → app_users (if signed in / configured).');
      try{ persistRender(); }catch(e){}
    };
    const gcal=document.getElementById('syncGcalBtn');
    if(gcal) gcal.onclick=function(){ syncGoogleCalendarReadonly(); };
    const icsb=document.getElementById('syncIcsBtn');
    const setAl=document.getElementById('setAlarmSound');
    if(setAl && !setAl._wired){ setAl._wired=true; setAl.addEventListener('change', function(){
      if(!state.settings) state.settings={}; state.settings.alarmSound=setAl.value;
      if(!state.wakeAlarm) state.wakeAlarm={}; state.wakeAlarm.sound=setAl.value;
      try{saveState();}catch(e){}
      showAppMessage('Sound saved','Used for Nudge.');
    }); }
    if(icsb) icsb.onclick=function(){

      if(!state.settings) state.settings={};
      state.settings.icsUrl=String(u||'').trim();
      try{saveState();}catch(e){}

    };

  if(!main) return;

  main.querySelectorAll('[data-action]').forEach(el=>{
    const action=el.dataset.action;

    if(id!==undefined && id!==null && id!==''){ const n=Number(id); id = (String(n)===String(id) && !Number.isNaN(n)) ? n : id; }
    else id=null;
    if(action==='toggle-done') el.addEventListener('change', ()=>toggleDone(id));
    else if(action==='open-task-menu') el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); openTaskMenu(id); });
    else if(action==='home-cal-open') el.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const kind=el.dataset.kind;
      const rawId=el.dataset.id;
      const date=el.dataset.date||todayStr();
      state.selectedDay=date;
      state.calRef=date;
      calendarBrowsing=true;

      if(kind==='class'){
        const c=(state.classes||[]).find(function(x){ return String(x.id)===String(rawId); });

        openListedEvent({kind:'class', id:c.id, label:c.title, time:c.start||'', end:c.end||'', seriesId:c.seriesId||'', source:c.source||''});

    else if(action==='quick-done') el.addEventListener('click', (e)=>{

      toggleDone(id);
    });
    
    else if(action==='open-date-edit') el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); state.editingTaskId=id; persistRender(); });
    else if(action==='save-inline-date') el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); const t=findTask(id); if(!t) return; const inp=document.getElementById('inlineDate-'+id)||document.getElementById('editDateText-'+id); if(inp) t.date=(inp.value||'').trim(); state.editingTaskId=null; persistRender(); });
    else if(action==='cancel-inline-date') el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); state.editingTaskId=null; persistRender(); });
    else if(action==='clear-inline-date') el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); const t=findTask(id); if(t) t.date=''; persistRender(); });
    else if(action==='delete-chunk') el.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const t=findTask(id); if(!t||!t.chunks) return;
      const idx=Number(el.dataset.idx);
      t.chunks.splice(idx,1); persistRender();
    });
    else if(action==='edit-chunk'){
      const saveChunk=()=>{
        const t=findTask(id); if(!t||!t.chunks) return;
        const idx=Number(el.dataset.idx);
        if(t.chunks[idx]) t.chunks[idx].text=String(el.value||'').trim();
        saveState();
      };
      el.addEventListener('change', saveChunk);
      el.addEventListener('blur', saveChunk);
    }
    else if(action==='toggle-chunk') el.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); const t=findTask(id); if(!t||!t.chunks) return; const idx=Number(el.dataset.chunk); if(t.chunks[idx]) t.chunks[idx].done=!t.chunks[idx].done; persistRender(); });

    else if(action==='task-start') el.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const tools = [
        {id:'timer', label:'Focus Pod'},
        {id:'bitesize', label:'Bite Size'},
        {id:'eisenhower', label:'This or That'},
        {id:'rule135', label:'Focus Plate'},
        {id:'challenges', label:'Challenges'}
      ];

        title: 'Start this task',
        body: 'Pick a tool to help you begin:',

        tools,
        taskId: id,
        onOk: ()=>{ state.topOfMindId=id; state.timer.activeTaskId=id; navigateTo('timer'); }

      // custom render for tools in modal - use showAppPrompt style

    else if(action==='task-complete') el.addEventListener('click', (e)=>{
      e.preventDefault(); e.stopPropagation();
      const t=findTask(id); if(!t) return;
      if(!t.done){ t.done=true; offerCelebration(); }

    if(state.dateEditId===undefined) state.dateEditId=null;
    if(!state.listMode) state.listMode='all'; // all | spotlight | wall | one | jar
    if(!state.spotlightSize) state.spotlightSize=3;
    if(state.jarQueue===undefined) state.jarQueue=null;
    if(state.oneAtATimeIndex===undefined) state.oneAtATimeIndex=0;
    if(state.topOfMindId===undefined) state.topOfMindId=null;
    if(!state.timeTrack) state.timeTrack={taskId:null, startedAt:null, accumulated:{}};
    if(state.backburner===undefined) state.backburner=[];
    if(!state.wakeAlarm) state.wakeAlarm={enabled:false,time:'07:00',days:[0,1,2,3,4],snoozesMax:2,snoozesLeft:2};
    if(state.wakeMathOpen===undefined) state.wakeMathOpen=false;
    if(state.wakeMath===undefined) state.wakeMath=null;
    if(state.deleteSeriesPrompt===undefined) state.deleteSeriesPrompt=null;
    if(state.settings.celebrateOnComplete===undefined) state.settings.celebrateOnComplete=true;
    if(state.settings.celebrateSound===undefined) state.settings.celebrateSound=true;
    if(!Array.isArray(state.whenThen)) state.whenThen=[];
    if(!Array.isArray(state.rewardingRoutines)) state.rewardingRoutines=[];
    if(!Array.isArray(state.strategicPlans)) state.strategicPlans=[];
    if(!Array.isArray(state.flipScripts)) state.flipScripts=[];
    if(!state.statsRangeStart){ const d=new Date(); d.setDate(d.getDate()-6); state.statsRangeStart=toDateStr(d); }
    if(!state.statsRangeEnd) state.statsRangeEnd=todayStr();
  }
  if(state.settings.quoteOnLoad && state.lastQuoteShownDate!==todayStr()){
    state.lastQuoteShownDate=todayStr();
    state.quoteModalOpen=true;
    state.quoteIndex=Math.floor(Math.random()*allQuotes().length);
  }
  if(state.timer && state.timer.running && state.timer.endsAt){
    if(state.timer.endsAt<=Date.now()) completeSegment(typeof isNativeApp==='function' && isNativeApp());
    else{
      state.timer.remaining=Math.max(1, Math.ceil((state.timer.endsAt-Date.now())/1000));
      clearInterval(timerHandle);
      timerHandle=setInterval(tick,1000);
      armWebFocusEnd();
      armFocusEndAlarm();
    }
  }
  render();
  try{ wirePhoneBack(); }catch(e){}
  try{ if(typeof completeRedirectSignIn==='function') await completeRedirectSignIn(); }catch(e){}
  try{
    if(typeof isNativeApp==='function' && isNativeApp()) history.replaceState(navSnapshot(), 'SnapBack', '#/');
  }catch(e){}
})();
</script>
</body>
</html>
