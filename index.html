<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>SnapBack — Study Companion</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2422">
<meta name="snapback-build" content="337">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SnapBack">
<style>
:root{
  --bg:#F2EFE7;
  --panel:#FFFFFF;
  --ink:#1E2422;
  --muted:#6C766E;
  --line:#DFDACD;
  --pine:#2F6F5E;
  --pine-soft:#DDEAE4;
  --amber:#DC8A3C;
  --amber-soft:#F7E6CE;
  --brick:#BE5240;
  --brick-soft:#F5DDD7;
  --blue:#4A6FA5;
  --blue-soft:#DEE6F1;
  --purple:#7C5FA6;
  --purple-soft:#EAE1F2;
  --gold:#C79A2E;
  --gold-soft:#F5E9C8;
  --grey-soft:#E7E4DC;
  --shadow:0 10px 26px rgba(30,36,34,.08);
  --radius:16px;
  --input-bg:#FCFBF8;
}
body/* dark-mode-title-fix */
.dark h1, .dark h2, .dark h3, .dark .pagehead h1, .dark .eyebrow, .dark summary, .dark label, .dark .setgroup summary {
  color: var(--ink) !important;
}
.dark p, .dark .muted { color: var(--muted) !important; }
.dark{

  --bg:#1A1E1C;
  --panel:#252A27;
  --ink:#F4F2EC;
  --muted:#B8C2BA;
  --line:#3A403C;
  --pine:#4A9B82;
  --pine-soft:#1E3A32;
  --amber:#E09A4C;
  --amber-soft:#3D2E1A;
  --brick:#D66A58;
  --brick-soft:#3D2420;
  --blue:#6A8FC5;
  --blue-soft:#1E2A3A;
  --purple:#9A7BC6;
  --purple-soft:#2A2238;
  --gold:#D4B04A;
  --gold-soft:#3A3218;
  --grey-soft:#2E3330;
  --shadow:0 10px 26px rgba(0,0,0,.35);
  --input-bg:#1E2422;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,h4{font-family:'Space Grotesk','Inter',system-ui,sans-serif;letter-spacing:-0.01em;margin:0 0 4px}
button{font-family:inherit}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:230px;flex-shrink:0;background:var(--ink);color:#F2EFE7;padding:20px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{padding:0 8px 16px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.brand .mark{font-size:1.3rem;font-weight:700;font-family:'Space Grotesk',sans-serif}
.brand .sub{font-size:.76rem;color:#B9C2BC;margin-top:2px}
.navsection{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:#8B958E;padding:12px 10px 4px;font-weight:700}
.navbtn{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:transparent;border:0;color:#E7E9E6;text-align:left;cursor:pointer;font-size:.87rem;width:100%}
.navbtn:hover{background:rgba(255,255,255,.08)}
.navbtn.active{background:var(--pine);color:#fff;font-weight:600}
.navbtn .ico{width:16px;text-align:center;flex-shrink:0}
.navfoot{margin-top:auto;font-size:.7rem;color:#8B958E;padding:10px 8px 0}

/* Main */
.main{flex:1;min-width:0;padding:28px 32px 70px;max-width:1080px}
.pagehead{margin-bottom:22px}
.pagehead .eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pagehead /* ink-safe-headings */
h1,h2,h3{color:var(--ink)}
label{color:var(--ink)}
summary{color:var(--ink)}
h1{font-size:1.6rem}
.pagehead p{color:var(--muted);margin:4px 0 0;font-size:.9rem}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h3{font-size:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:820px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

label{font-size:.77rem;color:var(--muted);font-weight:600;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--input-bg);font:inherit;font-size:.9rem;color:var(--ink)}
input[type="checkbox"],input[type="radio"]{width:auto;padding:0;margin:0 8px 0 0;vertical-align:middle;flex:0 0 auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pine);outline-offset:1px;border-color:var(--pine)}
.field{margin-bottom:9px}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1;min-width:100px}

.btn{border:0;border-radius:10px;padding:9px 15px;background:var(--pine);color:#fff;cursor:pointer;font-weight:600;font-size:.86rem}
.btn:hover{background:#265b4d}
.btn.warm{background:var(--amber)}
.btn.warm:hover{background:#c67a2e}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--grey-soft)}
.btn.danger{background:var(--brick)}
.btn.danger:hover{background:#a3402f}
.btn.gold{background:var(--gold)}
.btn.sm{padding:5px 10px;font-size:.75rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid transparent;cursor:pointer;user-select:none}
.chip.off{background:var(--grey-soft);color:var(--muted)}
.chip.urgent-on{background:var(--brick-soft);color:var(--brick);border-color:#e3b3a8}
.chip.important-on{background:var(--blue-soft);color:var(--blue);border-color:#b7c6e0}
.chip.must-on{background:var(--gold-soft);color:#8a6a1a;border-color:#e6cf8f}
.chip.frog-on{background:var(--gold-soft);color:#8a6a1a;border-color:#e6cf8f;font-weight:800}
.badge{display:inline-block;padding:3px 8px;border-radius:8px;font-size:.68rem;font-weight:700}
.badge.high{background:var(--brick-soft);color:var(--brick)}
.badge.medium{background:var(--amber-soft);color:#8a5a1f}
.badge.low{background:var(--pine-soft);color:var(--pine)}
.badge.overdue{background:var(--brick);color:#fff}
.badge.dueToday{background:var(--gold);color:#fff}

/* Tasks */
.tasklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.taskcard{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:var(--panel);margin-bottom:4px}
.taskcard.done{opacity:.55}
.taskcard.done .ttitle{text-decoration:line-through}
.trow-top{display:flex;align-items:flex-start;gap:12px}
.check{width:22px;height:22px;flex-shrink:0;margin-top:4px;cursor:pointer;accent-color:var(--pine)}
.ttitle{font-weight:600;font-size:1.05rem}
.ttitle-edit{width:100%;font-family:inherit;font-size:1.05rem;font-weight:600;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:8px}
.ttitle-edit:hover{border-color:var(--line)!important}
.ttitle-edit:focus{border-color:var(--pine)!important;background:var(--input-bg)!important;outline:none}
.taskcard.done .ttitle-edit{text-decoration:line-through;opacity:.65}
.tmeta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.tmeta input[type=date],.tmeta input[type=time]{width:auto;padding:7px 10px;font-size:.82rem;border-radius:9px}
.tmeta select{width:auto;padding:7px 10px;font-size:.82rem;border-radius:9px}
.taskactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.task-section{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.task-section-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.suggest{font-size:.71rem;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.suggest button{background:none;border:1px dashed #C9C2B0;color:var(--muted);border-radius:999px;padding:3px 9px;font-size:.69rem;cursor:pointer}
.suggest button:hover{border-color:var(--pine);color:var(--pine)}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:.82rem;cursor:pointer;font-weight:500}
.filters button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters button:hover{border-color:var(--pine)}
.empty{color:var(--muted);font-size:.86rem;padding:14px;text-align:center;border:1px dashed var(--line);border-radius:12px}

/* Today dashboard */
.nn-card{background:linear-gradient(135deg,var(--gold-soft),#fff);border:1px solid #E6CF8F;border-radius:16px;padding:16px 18px}
.nn-card .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#8a6a1a;font-weight:800}
.nn-card .nntext{font-size:1.15rem;font-weight:700;margin-top:4px}
.mustcould{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.mustcould{grid-template-columns:1fr}}
.mc-col h4{font-size:.85rem;margin-bottom:8px}
.mc-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#FDFCFA;border:1px solid var(--line);margin-bottom:7px;font-size:.87rem;flex-wrap:wrap}
.deadline-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.deadline-row:last-child{border-bottom:none}
.classrow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:.87rem}
.classrow:last-child{border-bottom:none}
.dotcolor{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* Focus pod / timer */
.timerwrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.ringwrap{position:relative;width:220px;height:220px}
.ringwrap svg{transform:rotate(-90deg)}
.ringbg{fill:none;stroke:var(--grey-soft);stroke-width:12}
.ringfg{fill:none;stroke:var(--pine);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .3s linear, stroke .3s}
.ringfg.break{stroke:var(--amber)}
.ringtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringtext .time{font-size:2.2rem;font-weight:800;font-family:'Space Grotesk',sans-serif}
.ringtext .mode{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-top:2px}
.timerbtns{display:flex;gap:10px;margin-top:16px}
.sessiondots{display:flex;gap:6px;margin-top:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--grey-soft)}
.dot.filled{background:var(--pine)}

/* Eisenhower */
.matrix{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:12px;min-height:320px}.eis-matrix .quad h4{font-size:1.05rem;margin:4px 0}
@media(max-width:700px){.matrix{grid-template-columns:1fr}}
.quad{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;min-height:170px}
.quad h4{margin:0 0 3px;font-size:.9rem}
.quad .qsub{font-size:.73rem;margin-bottom:8px}
.quad.q1{background:var(--brick-soft)}.quad.q1 h4{color:var(--brick)}
.quad.q2{background:var(--blue-soft)}.quad.q2 h4{color:var(--blue)}
.quad.q3{background:var(--amber-soft)}.quad.q3 h4{color:#8a5a1f}
.quad.q4{background:var(--grey-soft)}.quad.q4 h4{color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px;overflow:auto}
.qcard{background:rgba(255,255,255,.7);border-radius:10px;padding:8px 10px;font-size:.83rem}
.qcard .qtitle{font-weight:600}
.qcard .qchips{margin-top:5px;display:flex;gap:5px}

/* Swiss cheese */
.cheesewrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.holelist{list-style:none;margin:0;padding:0;flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.hole{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#FDFCFA}
.hole.eaten{opacity:.5}
.hole.eaten .htext{text-decoration:line-through}
.htext{flex:1;font-size:.89rem}
.templaterow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 10px;align-items:center}
.templaterow button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-size:.82rem;cursor:pointer;font-weight:600}
.templaterow button:hover{border-color:var(--pine);color:var(--pine);background:var(--pine-soft)}
.wheremap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wheremap-card{border:1px solid var(--line);border-radius:14px;padding:12px;background:#FDFCFA;display:flex;flex-direction:column;gap:6px;text-align:center;cursor:pointer}
.wheremap-card:hover{border-color:var(--pine)}
.wheremap-card .wm-ico{font-size:1.6rem}
.wheremap-card .wm-name{font-weight:700;font-size:.85rem}
.wheremap-card .wm-desc{font-size:.74rem;color:var(--muted);flex:1}
.techcard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#FDFCFA;margin-bottom:10px}
.techcard .tc-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.techcard .tc-ico{font-size:1.8rem}
.techcard .tc-name{font-weight:700;font-size:1rem}
.techcard .tc-when{font-size:.78rem;color:var(--pine);font-weight:600}
.techcard p{font-size:.85rem;margin:4px 0}
.faqitem{border:1px solid var(--line);border-radius:12px;padding:2px 14px;margin-bottom:8px;background:#FDFCFA}
.faqitem summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:10px 0;list-style:none}
.faqitem summary::-webkit-details-marker{display:none}
.faqitem summary:before{content:'+ ';color:var(--pine);font-weight:800}
.faqitem[open] summary:before{content:'\2212 '}
.faqitem p{font-size:.85rem;color:var(--muted);margin:0 0 12px}

/* Calendar */
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}.calnav-title{font-weight:700;flex:1 1 auto;text-align:center;min-width:160px;line-height:1.3;padding:4px 6px}
.calnav .spacer{flex:1}
.monthgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dowhead{font-size:.68rem;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700;padding-bottom:3px}
.daycell{border:1px solid var(--line);border-radius:10px;min-height:74px;padding:5px 6px;background:#FDFCFA;cursor:pointer;font-size:.74rem}
.daycell.otherMonth{opacity:.38}
.daycell.today{border-color:var(--pine);border-width:2px}
.daycell.selected{background:var(--pine-soft)}
.daynum{font-weight:700;font-size:.78rem}
.daydots{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.weekcol{border:1px solid var(--line);border-radius:12px;padding:8px;background:#FDFCFA;min-height:220px}
.weekcol.today{border-color:var(--pine);border-width:2px}
.weekcol h5{font-size:.76rem;margin:0 0 6px;text-align:center}
.wk-item{border-radius:8px;padding:5px 7px;font-size:.72rem;margin-bottom:5px;border-left:3px solid transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:.76rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.agenda{margin-top:16px}

/* Money */
.moneylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.moneyrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#FDFCFA;font-size:.88rem}
.moneyamt{font-weight:700}
.moneyamt.expense{color:var(--brick)}
.moneyamt.income{color:var(--pine)}
.moneystats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.statbox{flex:1;min-width:130px;background:#FDFCFA;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.statbox .lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.statbox .val{font-size:1.3rem;font-weight:800;font-family:'Space Grotesk',sans-serif}

/* Soundscape */
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.wheelwrap svg{cursor:pointer}
.playertrack{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#FDFCFA;margin-bottom:7px;font-size:.85rem}
.playertrack.active{border-color:var(--pine);background:var(--pine-soft)}
.playerbar{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px}
.slider{width:120px}

/* Time blocking */
.tblock-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tblock{display:flex;align-items:center;gap:10px;border-left:4px solid var(--purple);border-radius:10px;padding:8px 12px;background:var(--purple-soft);font-size:.88rem}

/* 1-3-5 */
.r135group{margin-bottom:14px}
.r135group h4{font-size:.82rem;margin-bottom:7px}
.r135item{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.r135item input[type=text]{flex:1}

/* Body doubling */
.bd-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.bd-clock{font-size:2.6rem;font-weight:800;font-family:'Space Grotesk',sans-serif}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--pine);margin:10px auto;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,111,94,.5)}70%{box-shadow:0 0 0 16px rgba(47,111,94,0)}100%{box-shadow:0 0 0 0 rgba(47,111,94,0)}}

/* Settings */
.setgroup{margin-bottom:18px}

/* Settings — one uniform collapsible style */
details.setgroup {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0;
  margin-bottom: 10px;
  overflow: hidden;
}
details.setgroup > summary {
  list-style: none;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.98rem;
  color: var(--ink);
  text-align: left;
  padding: 14px 16px;
  margin: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  background: var(--card);
  border: none;
}
details.setgroup:nth-child(even of details.setgroup) > summary,
details.setgroup.alt > summary {
  background: #F4F7F5;
}
details.setgroup > summary::-webkit-details-marker { display: none; }
details.setgroup > summary::after {
  content: '▸';
  color: var(--muted);
  font-weight: 600;
  font-size: 0.9rem;
  flex-shrink: 0;
}
details.setgroup[open] > summary::after { content: '▾'; }
details.setgroup > .setgroup-body,
details.setgroup > div:not(summary) {
  padding: 0 16px 14px 16px;
  border-top: 1px solid var(--line);
  text-align: left;
}

details.setgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
details.setgroup>summary{list-style:none;font-weight:700;font-size:.95rem;cursor:pointer;color:var(--ink);padding:4px 0}
details.setgroup>summary::-webkit-details-marker{display:none}
details.setgroup>summary::before{content:'▸ ';color:var(--muted)}
details.setgroup[open]>summary::before{content:'▾ '}
details.setgroup .setgroup-body{margin-top:12px}
.setgroup h4{font-size:.85rem;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:none}
.switch{position:relative;width:42px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slidepill{position:absolute;cursor:pointer;inset:0;background:#D6D0C1;border-radius:999px;transition:.2s}
.slidepill:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slidepill{background:var(--pine)}
.switch input:checked + .slidepill:before{transform:translateX(18px)}
.savedmsg{font-size:.77rem;color:var(--pine);font-weight:600;height:16px}
.undo-banner{position:sticky;top:0;z-index:50;background:var(--pine);color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:0 0 12px 12px;margin:0 0 12px}
.undo-banner button{background:#fff;color:var(--pine);border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}

<script>
(function(){
  try{
    if(!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) return;
    var g=sessionStorage.getItem.bind(sessionStorage);
    var s=sessionStorage.setItem.bind(sessionStorage);
    var r=sessionStorage.removeItem.bind(sessionStorage);
    sessionStorage.getItem=function(k){ var v=g(k); if(v!=null) return v; try{ return localStorage.getItem('sb_sess_'+k); }catch(e){ return null; } };
    sessionStorage.setItem=function(k,v){ s(k,v); try{ localStorage.setItem('sb_sess_'+k, String(v)); }catch(e){} };
    sessionStorage.removeItem=function(k){ r(k); try{ localStorage.removeItem('sb_sess_'+k); }catch(e){} };
  }catch(e){}
})();
/* ============================================================
   Storage — works in Claude artifact runtime AND as a plain file
   ============================================================ */
const STORAGE_KEY='focuspod_state_v2';
const hasWidgetStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get==='function');

async function loadState(){
  if(hasWidgetStorage){
    try{
      const r = await window.storage.get(STORAGE_KEY, false);
      if(r) return JSON.parse(r.value);
    }catch(e){ /* expected occasionally — falls back to localStorage below */ }
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* localStorage unavailable — nothing we can do, start fresh */ }
  return null;
}
async function saveState(){
  try{
    const json = JSON.stringify(state);
    let ok=false;
    if(typeof hasWidgetStorage!=='undefined' && hasWidgetStorage && window.storage){
      try{
        const r = window.storage.set(STORAGE_KEY, json, false);
        if(r && typeof r.then==='function'){
          r.then(function(v){ if(v) ok=true; }).catch(function(){});
        } else if(r) ok=true;
      }catch(e){}
    }
    try{
      localStorage.setItem(STORAGE_KEY, json);
      ok=true;
    }catch(e){
      console.warn('localStorage save failed', e);
    }
    // Automatic local safety snapshots (no user action required)
    try{ autoLocalSnapshot(json); }catch(e){}
    // Automatic cloud backup when signed in / sync code active
    try{ if(typeof pushCloudSync==='function') pushCloudSync(); }catch(e){}
  }catch(e){
    console.warn('saveState', e);
  }
}

const AUTO_SNAP_KEY = 'snapback_auto_snapshots_v1';
const AUTO_SNAP_META = 'snapback_auto_snap_meta_v1';
function autoLocalSnapshot(json){
  try{
    const now = Date.now();
    let meta = {};
    try{ meta = JSON.parse(localStorage.getItem(AUTO_SNAP_META)||'{}')||{}; }catch(e){ meta={}; }
    // At most one snapshot every 3 minutes, and keep last 5
    if(meta.lastAt && (now - meta.lastAt) < 3*60*1000) return;
    let list = [];
    try{ list = JSON.parse(localStorage.getItem(AUTO_SNAP_KEY)||'[]')||[]; }catch(e){ list=[]; }
    if(!Array.isArray(list)) list=[];
    list = [{ at: new Date().toISOString(), size: (json||'').length, data: json }];
    localStorage.setItem(AUTO_SNAP_KEY, JSON.stringify(list));
    localStorage.setItem(AUTO_SNAP_META, JSON.stringify({ lastAt: now, count: list.length }));
  }catch(e){
    // Quota or private mode — ignore; primary localStorage still holds live state
  }
}
function getAutoSnapshots(){
  try{
    const list = JSON.parse(localStorage.getItem(AUTO_SNAP_KEY)||'[]')||[];
    return Array.isArray(list) ? list : [];
  }catch(e){ return []; }
}
function restoreAutoSnapshot(index){
  const list = getAutoSnapshots();
  const item = list[index];
  if(!item || !item.data){ showAppMessage('No snapshot', 'No automatic backup found for that slot.'); return; }
  try{
    const incoming = JSON.parse(item.data);
    if(!incoming || typeof incoming!=='object'){ showAppMessage('Invalid snapshot', 'Could not read that automatic backup.'); return; }
    var whenLabel = item.at ? new Date(item.at).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}) : 'the recent safety copy';
    showAppMessage('Restore safety copy?', 'Put the app back to how it was at '+whenLabel+'. Your current data on this device will be replaced.', {
      ok:'Restore', cancel:'Cancel',
      onOk: function(){
        try{
          Object.keys(incoming).forEach(function(k){ state[k]=incoming[k]; });
          saveState();
          persistRender();
          showAppMessage('Restored', 'Your data was restored from the automatic safety copy.');
        }catch(e){ showAppMessage('Restore failed', String(e&&e.message||e)); }
      }
    });
  }catch(e){ showAppMessage('Restore failed', String(e&&e.message||e)); }
}
let saveDebounceTimer=null;
function debouncedSave(){
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer=setTimeout(saveState, 500);
}

/* ============================================================

function toDateStr(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }


function compactDateHtml(t){
  const editing = state.dateEditId===t.id;
  const label = t.date ? (t.date + (t.time ? ' · '+t.time : '')) : 'No date';
  if(!editing){
    return `<button type="button" class="btn ghost sm" data-action="open-date-edit" data-id="${t.id}" style="font-size:.8rem;margin:4px 0">📅 ${escapeHtml(label)}</button>`;
  }
  const base = (t.date && /^\d{4}-\d{2}-\d{2}$/.test(t.date)) ? t.date : todayStr();
  let y0=+base.slice(0,4), m0=base.slice(5,7), d0=base.slice(8,10);
  const cy=new Date().getFullYear();
  if(y0<cy-1 || y0>cy+5) y0=cy;
  const years=[]; for(let y=cy-1; y<=cy+4; y++) years.push(y);
  const months=[['01','Jan'],['02','Feb'],['03','Mar'],['04','Apr'],['05','May'],['06','Jun'],['07','Jul'],['08','Aug'],['09','Sep'],['10','Oct'],['11','Nov'],['12','Dec']];
  const dim=new Date(y0,+m0,0).getDate();
  const days=[]; for(let d=1;d<=dim;d++) days.push(String(d).padStart(2,'0'));
  if(+d0>dim) d0=String(dim).padStart(2,'0');
  return `<div class="inline-date" data-id="${t.id}" style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0;padding:8px;background:var(--pine-soft);border-radius:10px" onclick="event.stopPropagation()">
    <select data-de="y" style="width:auto;min-width:72px;padding:6px 8px;font-size:.85rem">${years.map(y=>`<option value="${y}" ${y===y0?'selected':''}>${y}</option>`).join('')}</select>
    <select data-de="m" style="width:auto;min-width:64px;padding:6px 8px;font-size:.85rem">${months.map(([v,l])=>`<option value="${v}" ${v===m0?'selected':''}>${l}</option>`).join('')}</select>
    <select data-de="d" style="width:auto;min-width:52px;padding:6px 8px;font-size:.85rem">${days.map(d=>`<option value="${d}" ${d===d0?'selected':''}>${+d}</option>`).join('')}</select>
    <input type="time" data-de="t" value="${t.time||''}" style="width:auto;min-width:90px;padding:6px 8px;font-size:.85rem">
    <button type="button" class="btn sm" data-action="save-inline-date" data-id="${t.id}">Save</button>
    <button type="button" class="btn ghost sm" data-action="clear-inline-date" data-id="${t.id}">Clear</button>
    <button type="button" class="btn ghost sm" data-action="cancel-inline-date" data-id="${t.id}">✕</button>
  </div>`;
}
function dateSelectsHtml(prefix, dateStr, timeStr){
  const base = dateStr && /^\d{4}-\d{2}-\d{2}$/.test(dateStr) ? dateStr : todayStr();
  let y0 = base.slice(0,4), m0 = base.slice(5,7), d0 = base.slice(8,10);
  const cy=new Date().getFullYear();
  if(+y0<cy-1||+y0>cy+4) y0=String(cy);
  const years=[]; for(let y=cy-1;y<=cy+4;y++) years.push(y);
  const months=[['01','Jan'],['02','Feb'],['03','Mar'],['04','Apr'],['05','May'],['06','Jun'],['07','Jul'],['08','Aug'],['09','Sep'],['10','Oct'],['11','Nov'],['12','Dec']];
  const days=[]; for(let d=1;d<=31;d++) days.push(String(d).padStart(2,'0'));
  return `<div class="row" style="gap:8px;flex-wrap:wrap">
    <div class="field" style="flex:1;min-width:90px"><label>Year</label>
      <select id="${prefix}Year">${years.map(y=>`<option value="${y}" ${String(y)===String(+y0)?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div class="field" style="flex:1;min-width:90px"><label>Month</label>
      <select id="${prefix}Month">${months.map(([v,l])=>`<option value="${v}" ${v===m0?'selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div class="field" style="flex:1;min-width:70px"><label>Day</label>
      <select id="${prefix}Day">${days.map(d=>`<option value="${d}" ${d===d0?'selected':''}>${+d}</option>`).join('')}</select>
    </div>
    <div class="field" style="flex:1;min-width:100px"><label>Time (optional)</label>
      <input type="time" id="${prefix}Time" value="${timeStr||''}">
    </div>
  </div>
  <label style="font-size:.82rem;margin-top:8px;display:flex;align-items:center;gap:8px">
    <input type="checkbox" id="${prefix}NoDate"> No due date
  </label>`;
}
function readDateSelects(prefix){
  const no = document.getElementById(prefix+'NoDate');
  if(no && no.checked) return {date:'', time:''};
  const y=document.getElementById(prefix+'Year')?.value;
  const m=document.getElementById(prefix+'Month')?.value;
  const d=document.getElementById(prefix+'Day')?.value;
  const time=document.getElementById(prefix+'Time')?.value||'';
  const yi=+y;
  if(!yi || yi<2000 || yi>2100) return {error:'Pick a year between 2020 and 2035'};
  const maxD=new Date(+y,+m,0).getDate();
  const day=Math.min(+d||1, maxD);
  return {date: y+'-'+m+'-'+String(day).padStart(2,'0'), time};
}

function formatWeekOf(iso){
  try{
    const d=new Date(String(iso).slice(0,10)+'T12:00:00');
    if(isNaN(d.getTime())) return String(iso||'');
    return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  }catch(e){ return String(iso||''); }
}
function todayStr(){ return toDateStr(new Date()); }
function tomorrowStr(){
  const d=new Date(); d.setDate(d.getDate()+1);
  return toDateStr(d);
}
function endOfWeekStr(){
  // Monday-start week: today through Sunday of this week
  const d=new Date();
  const day=(d.getDay()+6)%7; // Mon=0
  const end=new Date(d);
  end.setDate(d.getDate()+(6-day));
  return toDateStr(end);
}
function startOfWeekStr(){
  const d=new Date();
  const day=(d.getDay()+6)%7;
  const start=new Date(d);
  start.setDate(d.getDate()-day);
  return toDateStr(start);
}
function isThisWeek(dateStr){
  if(!dateStr) return false;
  // Full Mon–Sun of the current week (not only from today forward)
  try{
    const a=startOfWeekStr(), e=endOfWeekStr();
    return dateStr>=a && dateStr<=e;
  }catch(e){
    const t=todayStr(), e2=endOfWeekStr();
    return dateStr>=t && dateStr<=e2;
  }
}
function mondayIndex(d){ return (d.getDay()+6)%7; } // Monday=0 ... Sunday=6

function playBeepFallback(){
  // Minimal WAV (short beep) via data URI — works when Web Audio is blocked
  try{
    const sr=22050, dur=0.35, n=Math.floor(sr*dur);
    const data=new Float32Array(n);
    for(let i=0;i<n;i++){
      const t=i/sr;
      data[i]=Math.sin(2*Math.PI*880*t)*Math.exp(-t*4)*0.6;
    }
    const buf=new ArrayBuffer(44+n*2);
    const v=new DataView(buf);
    const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
    w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt ');
    v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    w(36,'data'); v.setUint32(40,n*2,true);
    let o=44;
    for(let i=0;i<n;i++){ let s=Math.max(-1,Math.min(1,data[i])); v.setInt16(o,s<0?s*0x8000:s*0x7FFF,true); o+=2; }
    const blob=new Blob([buf],{type:'audio/wav'});
    const url=URL.createObjectURL(blob);
    const a=new Audio(url);
    a.volume=1;
    const p=a.play();
    if(p&&p.catch) p.catch(()=>{});
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    return true;
  }catch(e){ return false; }
}

/** Very different patterns so users can tell them apart */
function playDistinctAlarm(ctx, kind, vol){
  const now = ctx.currentTime;
  const out = ctx.destination;
  console.log('playDistinctAlarm kind=', kind);
  function tone(type, freq, t0, dur, peak, freqEnd){
    const osc=ctx.createOscillator(), g=ctx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd) osc.frequency.linearRampToValueAtTime(freqEnd, t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(Math.max(0.05, peak), t0+0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+Math.max(0.05, dur));
    osc.connect(g); g.connect(out);
    osc.start(t0); osc.stop(t0+dur+0.05);
  }
  // EXTREMELY different patterns (rhythm + pitch + length)
  if(kind==='beep'){
    for(let i=0;i<5;i++) tone('square', 1400, now+i*0.2, 0.08, vol*0.55);
  } else if(kind==='bell'){
    tone('sine', 330, now, 2.2, vol*0.85);
    tone('sine', 660, now, 1.6, vol*0.3);
  } else if(kind==='digital'){
    [500,700,900,1100,1400,1800].forEach((f,i)=> tone('square', f, now+i*0.07, 0.06, vol*0.45));
  } else if(kind==='radar'){
    tone('sawtooth', 300, now, 0.85, vol*0.4, 1100);
    tone('sawtooth', 300, now+0.95, 0.85, vol*0.4, 1100);
  } else if(kind==='knock'){
    // Loud wake-up: repeated mid-high square bursts (more audible than soft thuds)
    for(let i=0;i<8;i++) tone('square', 880, now+i*0.28, 0.14, vol*0.9);
    for(let i=0;i<4;i++) tone('square', 1200, now+0.1+i*0.28, 0.1, vol*0.7);
  } else {
    // chime
    [523, 659, 784, 1047].forEach((f,i)=> tone('sine', f, now+i*0.25, 0.5, vol*0.6));
  }
}
/**
 * Nudge / wake: gradual volume over ~50 seconds, repeating soft pulses.
 * Uses settings.soundVolume as the peak (phone volume keys still control the device;
 * the in-app slider sets peak loudness of this alarm).
 */
function playAlarmRamp(durationSec, force){
  stopAlarmRamp();
  if(!force && state.settings && state.settings.soundOn===false) return;
  const ctx = ensureAudio(); if(!ctx) return;
  try{ if(ctx.state==='suspended') ctx.resume(); }catch(e){}
  const total = durationSec || 55;
  const peak = Math.max(0.2, Math.min(1, Number(state.settings&&state.settings.soundVolume)||0.95));
  const kind = (state.wakeAlarm&&state.wakeAlarm.sound) || (state.settings&&state.settings.alarmSound) || 'chime';
  const master = ctx.createGain();
  master.gain.setValueAtTime(0.05, ctx.currentTime);
  master.gain.linearRampToValueAtTime(peak, ctx.currentTime + Math.min(8, total));
  master.connect(ctx.destination);
  let stopped = false;
  const timers = [];
  function tone(type, freq, at, dur, vol){
    try{
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type=type; osc.frequency.value=freq;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.linearRampToValueAtTime(vol, at+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at+dur);
      osc.connect(g); g.connect(master);
      osc.start(at); osc.stop(at+dur+0.02);
    }catch(e){}
  }
  function pulse(){
    if(stopped) return;
    const now = ctx.currentTime;
    try{
      if(kind==='beep'){
        tone('square', 1400, now, 0.1, 0.55);
        tone('square', 1400, now+0.15, 0.1, 0.55);
        tone('square', 1400, now+0.3, 0.1, 0.55);
      } else if(kind==='bell'){
        tone('sine', 880, now, 0.9, 0.5);
        tone('sine', 1320, now, 0.7, 0.25);
        tone('sine', 1760, now, 0.5, 0.12);
      } else if(kind==='digital'){
        tone('square', 880, now, 0.08, 0.45);
        tone('square', 1174, now+0.1, 0.08, 0.45);
        tone('square', 1318, now+0.2, 0.12, 0.5);
      } else if(kind==='radar'){
        tone('sawtooth', 400, now, 0.35, 0.35);
        tone('sawtooth', 600, now+0.2, 0.35, 0.3);
        tone('sawtooth', 900, now+0.4, 0.25, 0.25);
      } else if(kind==='knock'){
        tone('square', 180, now, 0.12, 0.7);
        tone('square', 150, now+0.18, 0.12, 0.7);
        tone('square', 120, now+0.36, 0.18, 0.8);
      } else {
        tone('sine', 523, now, 0.35, 0.4);
        tone('sine', 659, now+0.12, 0.35, 0.4);
        tone('sine', 784, now+0.24, 0.5, 0.45);
      }
    }catch(e){}
  }
  pulse();
  for(let ms=1100; ms < total*1000; ms+=1100){
    timers.push(setTimeout(function(){ if(!stopped) pulse(); }, ms));
  }
  timers.push(setTimeout(function(){ stopAlarmRamp(); }, total*1000+400));
  _alarmRamp = {
    stop: function(){
      stopped = true;
      timers.forEach(function(id){ try{ clearTimeout(id); }catch(e){} });
      try{
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(0.0001, ctx.currentTime);
        master.disconnect();
      }catch(e){}
    }
  };
}

    osc.start(); osc.stop(ctx.currentTime+0.2);
  }
  ambientScheduler=setInterval(()=>{ if(Math.random()<0.6) chirpOnce(); }, 2000);
}
function scheduleCampfirePops(ctx){
  function popOnce(){
    if(!ambientGain) return;
    const bufferSize=Math.floor(ctx.sampleRate*0.06);
    const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*(1-i/bufferSize);
    const src=ctx.createBufferSource(); src.buffer=buffer;
    const filt=ctx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=1500;
    const g=ctx.createGain(); g.gain.value=state.settings.ambientVolume*0.7;
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start();
  }
  ambientScheduler=setInterval(()=>{ if(Math.random()<0.5) popOnce(); }, 700);
}

/** Build looping colored-noise AudioBuffer for Focus Pod soundscape */
function makeNoiseBuffer(ctx, kind){
  try{
    const sr = ctx.sampleRate || 44100;
    const seconds = 2;
    const n = Math.floor(sr * seconds);
    const buffer = ctx.createBuffer(1, n, sr);
    const data = buffer.getChannelData(0);
    const k = String(kind || 'brown').toLowerCase();
    let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
    let last = 0;
    for(let i=0; i<n; i++){
      let white = Math.random()*2 - 1;
      let out = white;
      if(k === 'pink'){
        b0 = 0.99886*b0 + white*0.0555179;
        b1 = 0.99332*b1 + white*0.0750759;
        b2 = 0.96900*b2 + white*0.1538520;
        b3 = 0.86650*b3 + white*0.3104856;
        b4 = 0.55000*b4 + white*0.5329522;
        b5 = -0.7616*b5 - white*0.0168980;
        out = b0+b1+b2+b3+b4+b5+b6 + white*0.5362;
        out *= 0.11;
        b6 = white*0.115926;
      } else if(k === 'brown' || k === 'brownian' || k === 'red'){
        last = (last + 0.02*white) / 1.02;
        out = last * 3.5;
      } else if(k === 'blue'){
        out = white - last;
        last = white;
        out *= 0.35;
      } else if(k === 'grey' || k === 'gray'){
        // mild high-shelf-ish via difference blend
        out = white*0.6 + (white - last)*0.25;
        last = white;
      } else {
        // white
        out = white * 0.5;
      }
      if(out > 1) out = 1;
      if(out < -1) out = -1;
      data[i] = out;
    }
    return buffer;
  }catch(e){
    console.warn('makeNoiseBuffer', e);
    // minimal fallback buffer
    try{
      const n = Math.floor((ctx.sampleRate||44100)*0.5);
      const buffer = ctx.createBuffer(1, n, ctx.sampleRate||44100);
      const data = buffer.getChannelData(0);
      for(let i=0;i<n;i++) data[i] = (Math.random()*2-1)*0.2;
      return buffer;
    }catch(e2){ return null; }
  }
}

function startAmbient(){
  const ctx=ensureAudio();
  if(!ctx){ try{ showAppMessage('No audio','This browser blocked sound.'); }catch(e){} return; }
  const run = function(){
  try{
  stopAmbientNode();
  if(!state.settings) state.settings={};
  let soundId = state.settings.noiseColor || 'brown';
  if(state.settings.adaptiveNoise && typeof pickAdaptiveColor==='function'){
    try{ soundId = pickAdaptiveColor() || soundId; }catch(e){}
  }
  soundId = String(soundId||'brown').toLowerCase();

  ambientGain=ctx.createGain();
  const vol = Math.max(0.15, Math.min(1, Number(state.settings.ambientVolume)||0.45));
  ambientGain.gain.value = vol;
  ambientGain.connect(ctx.destination);

  if(soundId==='ocean'){
    ambientNode=ctx.createBufferSource(); ambientNode.buffer=makeNoiseBuffer(ctx,'brown'); if(!ambientNode.buffer) return; ambientNode.loop=true;
    ambientFilter=ctx.createBiquadFilter(); ambientFilter.type='lowpass'; ambientFilter.frequency.value=700;
    ambientNode.connect(ambientFilter); ambientFilter.connect(ambientGain);
    ambientGain.gain.value=Math.max(0.08, state.settings.ambientVolume*0.6);
    ambientLFO=ctx.createOscillator(); ambientLFO.frequency.value=0.13;
    ambientLFOGain=ctx.createGain(); ambientLFOGain.gain.value=state.settings.ambientVolume*0.35;
    ambientLFO.connect(ambientLFOGain); ambientLFOGain.connect(ambientGain.gain);
    ambientLFO.start(); ambientNode.start();
  }else if(soundId==='rain'){
    ambientNode=ctx.createBufferSource(); ambientNode.buffer=makeNoiseBuffer(ctx,'white'); if(!ambientNode.buffer) return; ambientNode.loop=true;
    ambientFilter=ctx.createBiquadFilter(); ambientFilter.type='highpass'; ambientFilter.frequency.value=1200;
    ambientNode.connect(ambientFilter); ambientFilter.connect(ambientGain);
    ambientNode.start();
  }else if(soundId==='wind'){
    ambientNode=ctx.createBufferSource(); ambientNode.buffer=makeNoiseBuffer(ctx,'pink'); if(!ambientNode.buffer) return; ambientNode.loop=true;
    ambientFilter=ctx.createBiquadFilter(); ambientFilter.type='lowpass'; ambientFilter.frequency.value=500;
    ambientNode.connect(ambientFilter); ambientFilter.connect(ambientGain);
    ambientLFO=ctx.createOscillator(); ambientLFO.frequency.value=0.07;
    ambientLFOGain=ctx.createGain(); ambientLFOGain.gain.value=250;
    ambientLFO.connect(ambientLFOGain); ambientLFOGain.connect(ambientFilter.frequency);
    ambientLFO.start(); ambientNode.start();
  }else if(soundId==='forest'){
    ambientNode=ctx.createBufferSource(); ambientNode.buffer=makeNoiseBuffer(ctx,'pink'); if(!ambientNode.buffer) return; ambientNode.loop=true;
    ambientFilter=ctx.createBiquadFilter(); ambientFilter.type='lowpass'; ambientFilter.frequency.value=900;
    ambientNode.connect(ambientFilter); ambientFilter.connect(ambientGain);
    ambientGain.gain.value=state.settings.ambientVolume*0.3;
    ambientNode.start();
    scheduleBirdChirps(ctx);
  }else if(soundId==='campfire'){
    ambientNode=ctx.createBufferSource(); ambientNode.buffer=makeNoiseBuffer(ctx,'brown'); if(!ambientNode.buffer) return; ambientNode.loop=true;
    ambientFilter=ctx.createBiquadFilter(); ambientFilter.type='lowpass'; ambientFilter.frequency.value=500;
    ambientNode.connect(ambientFilter); ambientFilter.connect(ambientGain);
    ambientNode.start();
    scheduleCampfirePops(ctx);
  }else{
    // plain colored noise (white/pink/brown/blue/grey)
    ambientNode=ctx.createBufferSource();
    const buf=makeNoiseBuffer(ctx, soundId==='ocean'?'brown':soundId);
    if(!buf){ showAppMessage('Sound failed','Could not build noise buffer.'); return; }
    ambientNode.buffer=buf; ambientNode.loop=true;
    ambientNode.connect(ambientGain);
    ambientNode.start();
  }
  }catch(err){
    console.warn('startAmbient', err);
    try{ showAppMessage('Sound failed', String(err&&err.message||err)); }catch(e){}
  }
  };
  if(ctx.state==='suspended'){
    ctx.resume().then(run).catch(function(){ run(); });
  } else run();
}
function stopAmbientNode(){
  try{
    if(ambientNode){ ambientNode.stop(); ambientNode.disconnect(); }
    if(ambientFilter) ambientFilter.disconnect();
    if(ambientLFO){ ambientLFO.stop(); ambientLFO.disconnect(); }
    if(ambientLFOGain) ambientLFOGain.disconnect();
    if(ambientGain) ambientGain.disconnect();
  }catch(e){}
  if(ambientScheduler){ clearInterval(ambientScheduler); ambientScheduler=null; }
  ambientNode=null; ambientGain=null; ambientFilter=null; ambientLFO=null; ambientLFOGain=null;
}
function setAmbientVolume(v){ state.settings.ambientVolume=v; if(ambientGain) ambientGain.gain.value=v; }

/* Playlist — plain Audio object kept OUTSIDE the DOM render cycle so it never gets interrupted by re-renders.
   Streaming pages (YouTube, YouTube Music, Spotify) aren't audio files — an <audio> element can't play them.
   Those are detected and routed to an embedded player instead; only direct audio file URLs (mp3/wav/etc.) use Audio(). */
let playerAudio = new Audio();
let lastAutoAdvance = 0;
playerAudio.addEventListener('ended', ()=> nextTrack());
playerAudio.addEventListener('error', ()=>{
  // A broken/unplayable direct URL fires 'error' (sometimes repeatedly). Stop instead of looping forever,
  // which is what was flooding storage saves and throwing console warnings before.
  if(state.player.playing){
    console.warn('This track could not be played:', playerAudio.src);
    state.player.playing=false;
    persistRender();
  }
});
function detectEmbed(rawUrl){
  let u;
  try{ u = new URL(rawUrl.trim()); }catch(e){ return null; }
  const host = u.hostname.replace(/^www\.|^m\./,'');
  const parts = u.pathname.split('/').filter(Boolean);

  if(host==='youtu.be'){
    const id = parts[0];
    if(id) return {provider:'YouTube', embedUrl:`https://www.youtube.com/embed/${id}?autoplay=1`, height:220};
  }
  if(host==='youtube.com' || host==='music.youtube.com'){
    const v = u.searchParams.get('v');
    if(v) return {provider:'YouTube', embedUrl:`https://www.youtube.com/embed/${v}?autoplay=1`, height:220};
    if(parts[0]==='embed' && parts[1]) return {provider:'YouTube', embedUrl:`https://www.youtube.com/embed/${parts[1]}?autoplay=1`, height:220};
    if(parts[0]==='shorts' && parts[1]) return {provider:'YouTube', embedUrl:`https://www.youtube.com/embed/${parts[1]}?autoplay=1`, height:220};
  }
  if(host==='open.spotify.com'){
    const kinds=['track','album','playlist','episode'];
    const idx=parts.findIndex(p=>kinds.includes(p));
    if(idx>=0 && parts[idx+1]) return {provider:'Spotify', embedUrl:`https://open.spotify.com/embed/${parts[idx]}/${parts[idx+1]}`, height:(parts[idx]==='playlist'||parts[idx]==='album')?380:152};
  }
  if(host==='soundcloud.com'){
    return {provider:'SoundCloud', embedUrl:`https://w.soundcloud.com/player/?url=${encodeURIComponent(rawUrl)}&auto_play=true&color=%232F6F5E`, height:166};
  }
  return null;
}
function isDirectAudioUrl(url){
  try{ return /\.(mp3|wav|ogg|m4a|aac|flac|opus|webm)$/i.test(url.split(/[?#]/)[0]); }catch(e){ return false; }
}
function playTrack(idx){
  if(!state.playlist.length) return;
  if(idx<0) idx=state.playlist.length-1;
  if(idx>=state.playlist.length) idx=0;
  state.player.currentIndex=idx;
  const track=state.playlist[idx];
  if(isDirectAudioUrl(track.url)){
    state.player.expandedIdx=null;
    playerAudio.src=track.url;
    playerAudio.volume=state.settings.ambientVolume;
    playerAudio.play().catch(()=>{
      // play() rejected (blocked, bad URL, CORS...) — surface it once instead of retrying silently forever
      console.warn('Could not play track (blocked or invalid URL):', track.url);
      state.player.playing=false;
      persistRender();
    });
    state.player.playing=true;
  }else{
    // Not a real audio file — never hand this to Audio() (that's what caused the "blocked or invalid URL" spam).
    // Streaming links can't be played inline reliably here, so just open them.
    playerAudio.pause();
    state.player.playing=false;
    window.open(track.url, '_blank', 'noopener');
  }
  persistRender();
}
function pauseTrack(){ playerAudio.pause(); state.player.playing=false; persistRender(); }
function nextTrack(){
  const now=Date.now();
  if(now-lastAutoAdvance<800) return; // guard against rapid repeat-fire loops
  lastAutoAdvance=now;
  playTrack(state.player.currentIndex+1);
}
function prevTrack(){ playTrack(state.player.currentIndex-1); }
function removeTrack(id){
  const idx=state.playlist.findIndex(t=>t.id===id);
  state.playlist=state.playlist.filter(t=>t.id!==id);
  if(idx===state.player.currentIndex) pauseTrack();
  state.player.expandedIdx=null;
  persistRender();
}
function addTrack(){
  const title=document.getElementById('trackTitle').value.trim();

  state.playlist.push({id:uid(),title,url});
  persistRender();
}

/* Soundscape dispatch — this is the "sync with Pomodoro" behaviour */
function startSoundscape(){
  if(state.settings.ambientSource==='playlist'){
    if(!state.playlist.length) return;
    const track=state.playlist[state.player.currentIndex||0];
    if(!isDirectAudioUrl(track.url)) return; // any external link needs a manual click — browsers block auto-opened tabs from a timer
    playTrack(state.player.currentIndex||0);
  }
  else{ startAmbient(); }
}
function stopSoundscape(){ stopAmbientNode(); playerAudio.pause(); state.player.playing=false; state.player.expandedIdx=null; }

/* ============================================================
   Timer logic
   ============================================================ */
function modeLength(mode){
  const s=state.settings;
  if(mode==='work') return s.workMin*60;
  if(mode==='shortBreak') return s.shortBreakMin*60;
  return s.longBreakMin*60;
}
function focusEndLabel(){
  const t=state.timer;

  if(t.mode==='shortBreak') return 'Short break done';
  return 'Long break done';
}
function armFocusEndAlarm(){
  try{
    if(typeof isNativeApp!=='function' || !isNativeApp()) return;
    const plug=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NudgeAlarm;
    if(!plug || typeof plug.scheduleFocus!=='function') return;
    if(!state.timer || !state.timer.running || !state.timer.endsAt) return;
    if(state.timer.endsAt<=Date.now()+800) return;
    plug.scheduleFocus({ at:String(state.timer.endsAt), label:focusEndLabel() }).catch(function(){});
  }catch(e){}
}
function disarmFocusEndAlarm(){
  try{
    const plug=window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.NudgeAlarm;
    if(plug && typeof plug.cancelFocus==='function') plug.cancelFocus().catch(function(){});
  }catch(e){}
}
let focusEndTimer=null;
function armWebFocusEnd(){
  clearTimeout(focusEndTimer);
  if(!state.timer || !state.timer.running || !state.timer.endsAt) return;
  const ms=state.timer.endsAt-Date.now();
  if(ms<=0) return;
  focusEndTimer=setTimeout(function(){ catchUpTimer(false); }, Math.min(ms+80, 2147483647));
}
function catchUpTimer(fromBackground){
  if(!state.timer || !state.timer.running || !state.timer.endsAt) return;
  if(state.timer.endsAt>Date.now()+400){
    state.timer.remaining=Math.max(1, Math.ceil((state.timer.endsAt-Date.now())/1000));
    try{ renderTimerOnly(); }catch(e){}
    armWebFocusEnd();
    return;
  }
  const phone=typeof isNativeApp==='function' && isNativeApp();
  completeSegment(!!fromBackground && phone);
}
document.addEventListener('visibilitychange', ()=>{
  if(!state.timer || !state.timer.running) return;
  if(document.hidden) armFocusEndAlarm();
  else catchUpTimer(true);
});
function startTimer(){
  const ctx=ensureAudio();
  try{ if(ctx && ctx.state==='suspended') ctx.resume(); }catch(e){}
  if(state.timer.mode==='work' && state.timer.remaining===state.timer.total){
    state.timer.distractionCount=0; state.timer.distractionSeconds=0;
  }
  // Auto-enable ambient for focus sessions if user expected sound
  if(state.timer.mode==='work'){
    if(state.settings.ambientVolume==null || state.settings.ambientVolume<0.05){
      state.settings.ambientVolume = 0.35;
    }
    if(state.settings.syncWithPomodoro!==false){
      state.settings.ambientOn = true;
      try{ startSoundscape(); }catch(e){ console.warn(e); }
    }
  }
  state.timer.endsAt=Date.now()+Math.max(1, state.timer.remaining)*1000;
  state.timer.running=true;
  clearInterval(timerHandle);
  timerHandle=setInterval(tick,1000);
  armWebFocusEnd();
  armFocusEndAlarm();
  persistRender();
}
function pauseTimer(){
  state.timer.running=false;
  state.timer.endsAt=null;
  clearInterval(timerHandle);
  clearTimeout(focusEndTimer);
  disarmFocusEndAlarm();
  if(state.settings.syncWithPomodoro) stopSoundscape();

}
function resetTimer(){
  clearInterval(timerHandle);
  clearTimeout(focusEndTimer);
  state.timer.running=false;
  state.timer.endsAt=null;
  disarmFocusEndAlarm();
  state.timer.remaining=modeLength(state.timer.mode);
  state.timer.total=state.timer.remaining;
  state.timer.distractionCount=0; state.timer.distractionSeconds=0;

}
function tick(){
  if(!state.timer.running){ clearInterval(timerHandle); return; }
  if(state.timer.endsAt){
    state.timer.remaining=Math.max(0, Math.ceil((state.timer.endsAt-Date.now())/1000));
    if(state.timer.remaining<=2 && !document.hidden) disarmFocusEndAlarm();
  }else{
    state.timer.remaining--;
  }
  if(state.timer.remaining<=0){ completeSegment(false); return; }
  renderTimerOnly();
}
function completeSegment(alreadyDue){
  clearInterval(timerHandle);
  clearTimeout(focusEndTimer);
  const doneLabel=focusEndLabel();
  state.timer.endsAt=null;
  disarmFocusEndAlarm();
  if(!alreadyDue){
    try{ playAlarm(); }catch(e){}
    try{
      if(document.hidden && !(typeof isNativeApp==='function' && isNativeApp()) && typeof Notification!=='undefined' && Notification.permission==='granted'){
        new Notification('SnapBack', {body:doneLabel});
      }
    }catch(e){}
  }
  if(state.settings.syncWithPomodoro) stopSoundscape();
  const t=state.timer;
  if(t.mode==='work'){
    t.sessionCount++;

    if(task) task.pomodoros=(task.pomodoros||0)+1;
    state.stats.treesGrown=(state.stats.treesGrown||0)+1;
    state.focusSessionLog[todayStr()]=(state.focusSessionLog[todayStr()]||0)+1;

    t.mode = goLong ? 'longBreak' : 'shortBreak';

  const shouldAuto = t.mode==='work' ? state.settings.autoStartWork : state.settings.autoStartBreaks;
  t.running=!!shouldAuto;
  if(t.running){
    t.endsAt=Date.now()+t.remaining*1000;
    if(state.settings.ambientOn && state.settings.syncWithPomodoro && t.mode==='work') startSoundscape();
    timerHandle=setInterval(tick,1000);
    armWebFocusEnd();
    armFocusEndAlarm();
  }
  persistRender();
}
function fmtTime(s){ const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }

function extractTime(text){
  let m = text.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if(m){
    let hour=Number(m[1]); const min=m[2]?Number(m[2]):0; const ap=m[3].toLowerCase();
    if(ap==='pm' && hour<12) hour+=12;
    if(ap==='am' && hour===12) hour=0;
    return {match:m[0], time:String(hour).padStart(2,'0')+':'+String(min).padStart(2,'0')};
  }
  m = text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if(m) return {match:m[0], time:String(Number(m[1])).padStart(2,'0')+':'+m[2]};
  return null;
}
function parseQuickAdd(raw){
  let text=raw;
  let date='';
  const setOffset=(days)=>{ const d=new Date(); d.setDate(d.getDate()+days); date=toDateStr(d); };
  const WEEKDAYS=['sun','mon','tue','wed','thu','fri','sat'];
  let m;
  if(/\btomorrow\b/i.test(text)){ setOffset(1); text=text.replace(/\btomorrow\b/i,''); }
  else if(/\btoday\b/i.test(text)){ setOffset(0); text=text.replace(/\btoday\b/i,''); }
  else if((m=text.match(/\bin (\d+) days?\b/i))){ setOffset(Number(m[1])); text=text.replace(m[0],''); }
  else if(/\bin a week\b/i.test(text)){ setOffset(7); text=text.replace(/\bin a week\b/i,''); }
  else if((m=text.match(/\bnext (sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i))){
    const target=WEEKDAYS.indexOf(m[1].toLowerCase());
    const now=new Date(); let delta=(target-now.getDay()+7)%7; if(delta===0) delta=7;
    const d=new Date(now); d.setDate(now.getDate()+delta); date=toDateStr(d);
    text=text.replace(m[0],'');
  }
  const t=extractTime(text);
  let time='';
  if(t){ time=t.time; text=text.replace(t.match,''); if(!date) setOffset(0); }
  text=text.replace(/\s{2,}/g,' ').replace(/\s+([,.;])/g,'$1').trim();
  return {title:text||raw.trim(), date, time};
}
function quickAddTask(){
  const input=document.getElementById('quickAddInput');
  const raw=input.value.trim();
  if(!raw) return;

function normalizeTaskDate(raw){
  if(raw==null) return '';
  let s=String(raw).trim();
  if(!s) return '';
  // Already ISO yyyy-mm-dd
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // dd/mm/yyyy or dd-mm-yyyy
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m){
    const d=m[1].padStart(2,'0'), mo=m[2].padStart(2,'0'), y=m[3];
    return y+'-'+mo+'-'+d;
  }
  // mm/dd/yyyy (US)
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  // Date parse fallback
  const tms=Date.parse(s);
  if(!isNaN(tms)){
    const dt=new Date(tms);
    if(!isNaN(dt.getTime())){
      const y=dt.getFullYear(), mo=String(dt.getMonth()+1).padStart(2,'0'), d=String(dt.getDate()).padStart(2,'0');
      return y+'-'+mo+'-'+d;
    }
  }
  return s;
}

let jigCtx = null;
function playJigBeat(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!jigCtx) jigCtx = new AC();
    if(jigCtx.state === 'suspended') jigCtx.resume();
    const ctx = jigCtx;
    const now = ctx.currentTime;
    // Simple upbeat 4/4 percussion loop ~12 seconds — original pattern, not a song
    const bpm = 112;
    const beat = 60 / bpm;
    const duration = 12; // seconds
    const master = ctx.createGain();
    master.gain.value = 0.22;
    master.connect(ctx.destination);

    function kick(t){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.15);
      g.gain.setValueAtTime(0.9, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + 0.22);
    }
    function snare(t){
      const frames = Math.floor(ctx.sampleRate * 0.08);
      const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<frames;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/frames, 2.2);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.35, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      const f = ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 1200;
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t);
    }
    function hat(t, open){
      const frames = Math.floor(ctx.sampleRate * (open ? 0.12 : 0.04));
      const buf = ctx.createBuffer(1, frames, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for(let i=0;i<frames;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/frames, open ? 1.2 : 3);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const g = ctx.createGain();
      g.gain.setValueAtTime(open ? 0.18 : 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.12 : 0.04));
      const f = ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 6000;
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t);
    }
    // Pattern: kick on 1 & 3, snare on 2 & 4, hats on 8ths
    const beats = Math.floor(duration / beat);
    for(let i=0;i<beats;i++){
      const t = now + i * beat;
      const step = i % 4;
      if(step === 0 || step === 2) kick(t);
      if(step === 1 || step === 3) snare(t);
      hat(t, false);
      hat(t + beat * 0.5, step === 1 || step === 3);
    }
    // Soft fade out at end
    master.gain.setValueAtTime(0.22, now + duration - 0.8);
    master.gain.linearRampToValueAtTime(0.001, now + duration);
  }catch(e){ console.warn('Jig beat failed', e); }
}

function normalizeChunks(t){
  if(!t) return [];
  if(!Array.isArray(t.chunks)) t.chunks = [];
  t.chunks = t.chunks.map(c=>{
    if(typeof c === 'string') return {id:uid(), text:c.trim(), done:false};
    if(!c || typeof c !== 'object') return null;
    const text = String(c.text != null ? c.text : (c.title != null ? c.title : (c.label != null ? c.label : ''))).trim();
    return {id: c.id || uid(), text, done: !!c.done};
  }).filter(c=>c && c.text);
  return t.chunks;
}

function parseBiteLinesFromText(raw){
  const lines=String(raw||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const bites=[];
  lines.forEach(l=>{
    let s=l
      .replace(/^#{1,6}\s*/,'')
      .replace(/^\s*[-*•●○▪▸►]+\s*/,'')
      .replace(/^\s*\d+[.)]\s*/,'')
      .replace(/^\s*\(\d+\)\s*/,'')
      .replace(/^\s*\[ \]\s*/,'')
      .replace(/^\s*\[[xX]\]\s*/,'')
      .replace(/\*\*/g,'')
      .replace(/^\s*[–—-]\s*/,'')
      .trim();
    // drop pure headings like "Total time:" if very short meta
    if(s.length>=2) bites.push(s);
  });
  if(!bites.length){
    const parts=String(raw||'').split(/[;|]/).map(p=>p.trim()).filter(p=>p.length>=2);
    if(parts.length>1) parts.forEach(p=>bites.push(p.slice(0,220)));
    else if(String(raw||'').trim().length>=2) bites.push(String(raw).trim().slice(0,220));
  }
  // de-dupe while preserving order
  const seen=new Set();
  return bites.filter(b=>{
    const k=b.toLowerCase();
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

function smartBreakdown(){
  const promptInput=document.getElementById('magicInput');
  const otherEl=document.getElementById('biteOtherTitle');
  const typed=(promptInput && promptInput.value.trim()) || (otherEl && otherEl.value.trim()) || (state.biteOtherTitle||'').trim();

    showAppMessage('Type something first', 'Enter a chapter or topic, then tap Break it down.');

  }

  if(!t){ if(status) status.textContent='Could not create task.'; return; }
  const title=typed || t.title || 'Study task';
  t.title = t.title || title;
  let steps;
  if(/research|paper|essay|elephants/i.test(title)){
    steps=[
      'Clarify the exact question for: '+title,
      'List 5 search keywords',
      'Find 2 sources and save links',
      'Notes from source 1 (5 bullets)',
      'Notes from source 2 (5 bullets)',
      'Outline: intro, 3 points, conclusion',
      'Write intro only',
      'Write body point 1',
      'Write body points 2–3',
      'Conclusion + proofread'
    ];
  } else if(/chapter|ciccarelli|textbook|section|unit|lesson/i.test(title) || /\bch\.?\s*\d+/i.test(title) || /\d+/.test(title)){
    const n=(title.match(/chapter\s*(\d+)/i)||title.match(/\b(\d+)\b/)||[])[1]||'';
    steps=[
      'Skim headings'+(n?' for chapter '+n:''),
      'List section titles',
      'Read section 1 — 3 bullet notes',
      'Read section 2 — 3 bullet notes',
      'Read next sections one at a time',
      'Review key terms',
      'Do 3 practice questions',
      'Write a 5-line summary',
      'Plan a 10-min review tomorrow'
    ];
  } else {
    const key=suggestTemplateForTitle(title);
    applyTemplate(key);
    if(status) status.textContent='Added “'+key+'” steps. Edit below.';
    return;
  }
  t.chunks=Array.isArray(t.chunks)?t.chunks:[];

  steps.forEach(s=>{ const tx=String(s||'').trim(); if(tx && !have.has(tx.toLowerCase())) t.chunks.push({id:uid(), text:tx, done:false}); });

function cheeseSvg(chunks){
  // Food plate version for Bite Size — teens love food metaphors
  const FOODS = ['🍕','🍔','🍟','🍣','🍩','🍪','🥑','🍎','🌮','🍦','🥪','🍜','🍇','🧁','🍗'];
  const doneCount = chunks.filter(c=>c.done).length;
  const items = chunks.map((c,i)=>{
    const food = FOODS[i % FOODS.length];
    const opacity = c.done ? '0.35' : '1';
    const size = c.done ? '1.4rem' : '1.8rem';
    return `<span style="font-size:${size};opacity:${opacity};transition:all .25s;display:inline-block;margin:3px" title="${c.done?'Eaten!':'Still on the plate'}">${food}</span>`;
  }).join('');
  return `
  <div style="width:190px;height:190px;border-radius:50%;background:linear-gradient(145deg,#f5e6c8,#e8d4a8);border:6px solid #c9a86c;box-shadow:inset 0 0 20px rgba(0,0,0,.08),0 8px 20px rgba(0,0,0,.12);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;align-content:center;padding:18px;margin:0 auto">
    ${chunks.length ? items : '<span style="font-size:2.2rem;opacity:.4">🍽️</span>'}
  </div>
  <div style="text-align:center;font-size:.78rem;color:var(--muted);margin-top:8px">${doneCount}/${chunks.length||0} bites taken</div>`;
}

function toMinutes(hhmm){
  if(!hhmm||!/^\d{1,2}:\d{2}$/.test(hhmm)) return null;
  const [h,m]=hhmm.split(':').map(Number);
  return h*60+m;
}
function rangesOverlap(a0,a1,b0,b1){
  return a0 < b1 && b0 < a1;
}
/** conflicts for a weekly day index OR a concrete dateStr */
function findScheduleConflicts({day, dateStr, start, end, ignoreId}){
  const s=toMinutes(start), e=toMinutes(end||start);
  if(s==null) return [];
  let endM = (e==null || e<=s) ? s+60 : e;
  const hits=[];
  const targetDay = day!=null ? Number(day) : (dateStr ? mondayIndex(new Date(dateStr+'T12:00:00')) : null);
  (state.classes||[]).forEach(c=>{
    if(ignoreId!=null && String(c.id)===String(ignoreId)) return;
    let applies=false;
    if(c.scope==='session'){
      applies = dateStr && c.date===dateStr;
    } else {
      applies = targetDay!=null && Number(c.day)===targetDay;
    }
    if(!applies) return;
    const cs=toMinutes(c.start), ce=toMinutes(c.end||c.start);
    if(cs==null) return;
    const cEnd = (ce==null || ce<=cs) ? cs+60 : ce;
    if(rangesOverlap(s,endM,cs,cEnd)) hits.push({kind:'class', title:c.title, start:c.start, end:c.end||''});
  });
  if(dateStr){
    (state.studyBlocks||[]).forEach(b=>{
      if(ignoreId!=null && String(b.id)===String(ignoreId)) return;
      if(b.date!==dateStr) return;
      const bs=toMinutes(b.start), be=toMinutes(b.end||b.start);
      if(bs==null) return;
      const bEnd = (be==null || be<=bs) ? bs+60 : be;
      if(rangesOverlap(s,endM,bs,bEnd)) hits.push({kind:'block', title:b.label, start:b.start, end:b.end||''});
    });
  }
  return hits;
}


function finishTtSave(list, asPM){
  if(asPM !== null){
    list = list.map(p=>{
      if(!p.ambiguous || p._timeEdited) return p;
      const toAM = (t)=>{
        let [h,m]=t.split(':').map(Number);
        if(h>=13 && h<=23) h-=12;
        return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      };
      const toPM = (t)=>{
        let [h,m]=t.split(':').map(Number);
        if(h>=1 && h<=11) h+=12;
        return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      };
      if(asPM) return {...p, start:toPM(p.start), end:toPM(p.end)};
      return {...p, start:toAM(p.start), end:toAM(p.end)};
    });
  }
  const once = (document.getElementById('ttRepeatMode')?.value === 'once') || list.some(p=>p.oneOff||p.date);
  function nextDateForDay(dayIdx){
    const d=new Date(); d.setHours(12,0,0,0);
    const jsDay = (dayIdx+1)%7;
    for(let i=0;i<7;i++){
      if(d.getDay()===jsDay) return toDateStr(d);
      d.setDate(d.getDate()+1);
    }
    return todayStr();
  }
  if(once){
    const added=[];
    list.forEach(p=>{
      const date=p.date || nextDateForDay(p.day);
      if(!warnIfConflicts({dateStr:date, start:p.start, end:p.end})) return;
      const id=uid();
      const item={id, label:p.title, date, start:p.start, end:p.end, meetingUrl:'', room:p.room||'', kind:'other', alarmMinutes:15};
      state.studyBlocks.push(item);
      added.push(item);
    });
    if(added.length) pushUndo({type:'bulk-add-blocks', items:added, label:added.length+' items saved — Undo'});
  } else {
    const queue=[];
    list.forEach(p=>{
      const entry={id:uid(), title:p.title, day:p.day, start:p.start, end:p.end, room:p.room||'', textbook:'', meetingUrl:'', scope:'semester', semStart: todayStr(), semEnd:'', kind:'class', alarmMinutes:15};
      const conflicts=findScheduleConflicts({day:p.day, start:p.start, end:p.end});
      queue.push({entry, conflicts});
    });
    openConflictQueue(queue);
    state.ampmPromptOpen=false;
    state.ampmPrompt=null;
    persistRender();
    return;
  }
  const paste=document.getElementById('ttPaste'); if(paste) paste.value='';
  const prev=document.getElementById('ttPreview'); if(prev) prev.innerHTML='';
  state.ampmPromptOpen=false;
  state.ampmPrompt=null;

}

function openConflictQueue(items){
  // items: [{entry, conflicts:[{title,start,end,kind,id?}]}]
  state.conflictQueue = items.filter(x=>x.conflicts && x.conflicts.length);
  state.conflictPass = items.filter(x=>!x.conflicts || !x.conflicts.length).map(x=>x.entry);
  state.conflictIdx = 0;
  if(!state.conflictQueue.length){
    state.conflictPass.forEach(e=>state.classes.push(e));
    if(state.conflictPass.length) pushUndo({type:'bulk-add-classes', items:[...state.conflictPass], label:state.conflictPass.length+' classes added — Undo'});
    state.conflictPass=[];
    persistRender();
    return;
  }
  state.conflictModalOpen = true;
  persistRender();
}
function currentConflict(){
  const q=state.conflictQueue||[];
  return q[state.conflictIdx]||null;
}
function resolveConflict(action){
  const cur=currentConflict();
  if(!cur) return;
  if(action==='add'){
    state.conflictPass.push(cur.entry);
  } else if(action==='replace'){
    // remove overlapping classes on same day
    const day=cur.entry.day;
    const s=toMinutes(cur.entry.start), e=toMinutes(cur.entry.end||cur.entry.start);
    const endM=(e==null||e<=s)?s+60:e;
    state.classes = state.classes.filter(c=>{
      if(c.scope==='session') return true;
      if(Number(c.day)!==Number(day)) return true;
      const cs=toMinutes(c.start), ce=toMinutes(c.end||c.start);
      if(cs==null) return true;
      const cEnd=(ce==null||ce<=cs)?cs+60:ce;
      return !rangesOverlap(s,endM,cs,cEnd);
    });
    state.conflictPass.push(cur.entry);
  } else if(action==='skip'){
    // do not add
  } else if(action==='edit'){
    const ns=document.getElementById('conflictNewStart')?.value;
    const ne=document.getElementById('conflictNewEnd')?.value;
    if(ns) cur.entry.start=ns;
    if(ne) cur.entry.end=ne;
    const again=findScheduleConflicts({day:cur.entry.day, start:cur.entry.start, end:cur.entry.end});
    if(again.length){
      cur.conflicts=again;
      persistRender();
      return; // stay on same item
    }
    state.conflictPass.push(cur.entry);
  }
  state.conflictIdx++;
  if(state.conflictIdx >= (state.conflictQueue||[]).length){
    state.conflictQueue.forEach(()=>{});
    const added=state.conflictPass||[];
    added.forEach(e=>state.classes.push(e));
    if(added.length) pushUndo({type:'bulk-add-classes', items:[...added], label:added.length+' classes saved — Undo'});
    state.conflictQueue=[];
    state.conflictPass=[];
    state.conflictIdx=0;
    state.conflictModalOpen=false;
  }
  persistRender();
}

function warnIfConflicts(opts){
  const hits=findScheduleConflicts(opts);
  if(!hits.length) return true;
  const msg='This time overlaps something already scheduled:\n\n'+
    hits.map(c=>'• '+c.title+' ('+c.start+(c.end?'–'+c.end:'')+')').join('\n')+
    '\n\nAdd anyway?';
  console.warn(msg); return true; // conflicts use modal elsewhere
}
function pushUndo(entry){
  if(!state.undoStack) state.undoStack=[];
  state.undoStack.unshift({...entry, ts:Date.now()});
  state.undoStack = state.undoStack.slice(0,10);
  state.undoBanner = entry.label || 'Change saved — Undo available';
}
function performUndo(){
  const u=(state.undoStack||[]).shift();
  state.undoBanner=null;
  if(!u) return;
  if(u.type==='delete-class' && u.item) state.classes.push(u.item);
  else if(u.type==='delete-task' && u.item) state.tasks.unshift(u.item);
  else if(u.type==='delete-block' && u.item) state.studyBlocks.push(u.item);
  else if(u.type==='delete-reminder' && u.item) state.customReminders.push(u.item);
  else if(u.type==='delete-habit' && u.item) state.habits.push(u.item);
  else if(u.type==='delete-money' && u.item) state.money.push(u.item);
  else if(u.type==='add-class' && u.id!=null) state.classes=state.classes.filter(c=>c.id!==u.id);
  else if(u.type==='add-block' && u.id!=null) state.studyBlocks=state.studyBlocks.filter(b=>b.id!==u.id);
  else if(u.type==='add-task' && u.id!=null) state.tasks=state.tasks.filter(t=>t.id!==u.id);
  else if(u.type==='bulk-add-classes' && u.items){
    const ids=new Set(u.items.map(i=>i.id));
    state.classes=state.classes.filter(c=>!ids.has(c.id));
  } else if(u.type==='delete-journal' && u.item){ state.journal=state.journal||[]; state.journal.unshift(u.item); }
  else if(u.type==='add-journal' && u.id){ state.journal=(state.journal||[]).filter(j=>j.id!==u.id); }
  else if(u.type==='bulk-add-blocks' && u.items){
    const ids=new Set(u.items.map(i=>i.id));
    state.studyBlocks=state.studyBlocks.filter(b=>!ids.has(b.id));
  }
  persistRender();
}

function wireFollowEnd(startEl, endEl){
  if(!startEl || !endEl || startEl._followEnd) return;
  startEl._followEnd=true;
  function toMin(v){
    const p=String(v||'').split(':');
    if(p.length<2 || p[0]==='') return null;
    const h=Number(p[0]), m=Number(p[1]);
    if(isNaN(h)||isNaN(m)) return null;
    return h*60+m;
  }
  function fromMin(mins){
    mins=((mins%(24*60))+(24*60))%(24*60);
    return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
  }
  function remember(){
    startEl.dataset.prev=startEl.value;
    endEl.dataset.prev=endEl.value;
  }
  remember();
  startEl.addEventListener('focus', remember);
  endEl.addEventListener('focus', remember);
  endEl.addEventListener('change', function(){ endEl.dataset.prev=endEl.value; });
  startEl.addEventListener('change', function(){
    const prevS=toMin(startEl.dataset.prev);
    const prevE=toMin(endEl.dataset.prev);
    const nowS=toMin(startEl.value);
    if(nowS==null) return;
    let dur=60;
    if(prevS!=null && prevE!=null && prevE>prevS) dur=prevE-prevS;
    endEl.value=fromMin(nowS+dur);
    startEl.dataset.prev=startEl.value;
    endEl.dataset.prev=endEl.value;
  });

/* ============================================================
   Mind maps — auto radial layout, no drag-and-drop required
   ============================================================ */
const MM_W=760, MM_H=520;
function layoutMindmapNodes(nodes){
  const byParent={};
  nodes.forEach(n=>{ if(n.parentId!=null){ byParent[n.parentId]=byParent[n.parentId]||[]; byParent[n.parentId].push(n); } });
  const root=nodes.find(n=>n.parentId==null);
  if(!root) return;
  root.x=MM_W/2; root.y=MM_H/2;
  function place(node, a0, a1, depth){
    const kids=byParent[node.id]||[];
    const n=kids.length; if(!n) return;
    const step=(a1-a0)/n;
    kids.forEach((k,i)=>{
      const a=a0+step*(i+0.5);
      const r=115+depth*105;
      k.x=root.x+Math.cos(a)*r;
      k.y=root.y+Math.sin(a)*r;
      const spread=Math.min(step*0.9, Math.PI*0.9);
      place(k, a-spread/2, a+spread/2, depth+1);
    });
  }
  place(root, -Math.PI*0.99, Math.PI*0.99, 1);
}

  persistRender();
}

const BD_TEMPLATES={
  sprint:{name:'Focus Sprint', desc:'One block, one goal. Declare it, work it, check out at the end — the core ritual behind 1:1 body doubling.', phases:[{label:'Focus block',min:50}]},
  cave:{name:'Guided Cave', desc:'A settle-in, two work sprints, and a break between — a structured session with more scaffolding.', phases:[{label:'Settle in',min:3},{label:'Work sprint 1',min:25},{label:'Break',min:5},{label:'Work sprint 2',min:25},{label:'Wrap-up',min:5}]},
  flow:{name:'Group Flow', desc:'A short goal round, one longer flow block, then a quick reflection on how it went.', phases:[{label:'Goal round',min:2},{label:'Flow block',min:45},{label:'Reflection',min:3}]}
};
function bdSelectTemplate(key){
  if(!BD_TEMPLATES[key]) return;
  if(!state.bodyDouble) state.bodyDouble={history:[]};
  const bd=state.bodyDouble;
  bd.templateKey=key; bd.stage='goal'; bd.phaseIndex=0;
  bd.remaining=BD_TEMPLATES[key].phases[0].min*60; bd.running=false;
  // Prefer linked technique task title as goal
  try{
    const tid=state.techniqueTaskId;
    const task=(state.tasks||[]).find(x=>String(x.id)===String(tid));
    bd.goal = task ? (task.title||'') : (bd.goal||'');
  }catch(e){ bd.goal=bd.goal||''; }

}

  const bd=state.bodyDouble;

  if(!g){
    try{
      const tid=state.techniqueTaskId;

      if(task) g=task.title||'';
    }catch(e){}
  }

  bd.goal=g;
  bd.stage='running';
  persistRender();

function bdStart(){
  ensureAudio();
  state.bodyDouble.running=true;
  clearInterval(bdHandle);
  bdHandle=setInterval(bdTick,1000);
  persistRender();
}
function bdPause(){ state.bodyDouble.running=false; clearInterval(bdHandle); persistRender(); }
function bdCancel(){ clearInterval(bdHandle); state.bodyDouble={stage:'pick',templateKey:null,goal:'',phaseIndex:0,remaining:0,running:false,history:state.bodyDouble.history}; persistRender(); }
function bdTick(){
  const bd=state.bodyDouble;
  bd.remaining--;
  if(bd.remaining<=0){
    playAlarm();
    const phases=BD_TEMPLATES[bd.templateKey].phases;
    bd.phaseIndex++;
    if(bd.phaseIndex>=phases.length){
      clearInterval(bdHandle);
      bd.running=false; bd.stage='checkout';
      persistRender();
      return;
    }
    bd.remaining=phases[bd.phaseIndex].min*60;
    persistRender();
    return;
  }
  renderBdOnly();
}
function bdCheckout(done){
  const bd=state.bodyDouble;
  const note=document.getElementById('bdNoteInput') ? document.getElementById('bdNoteInput').value.trim() : '';
  bd.history.unshift({date:todayStr(), template:BD_TEMPLATES[bd.templateKey].name, goal:bd.goal, done, note});
  bd.history=bd.history.slice(0,8);
  state.bodyDouble={stage:'pick',templateKey:null,goal:'',phaseIndex:0,remaining:0,running:false,history:bd.history};
  persistRender();
}

          : 'Not granted. Phone Settings → Apps → SnapBack → Notifications → Allow.';
      state.lastNotifyMsg = msg;
      if(status) status.textContent = msg;
      }
      showAppMessage('Notifications', ok
        ? 'Allowed. If rare alerts: Apps → SnapBack → Notifications → Unrestricted.'
        : 'Permission missing. Enable under Apps → SnapBack → Notifications.');
      if(ok && typeof scheduleNativeNotification==='function'){
        scheduleNativeNotification({
          key:'grant-test-'+Date.now(),
          title:'SnapBack',
          body:'Test alert — notifications are working.',
          when: new Date(Date.now()+4000)
        }).then(sent=>{
          if(status) status.textContent = (status.textContent||'') + (sent ? ' · Test alert in ~4 seconds — watch the shade/status bar.' : ' · Could not schedule test alert.');
        });
      }
      try{ persistRender(); }catch(e){}
    }).catch(e=>{
      if(status) status.textContent='Could not request: '+(e&&e.message?e.message:'error');
    });
    return;
  }
  // Website / browser
  if(!('Notification' in window)){
    if(status) status.textContent='Not supported in this browser. Use the phone APK for reliable reminders.';
    return;
  }
  const timeout=new Promise(res=>setTimeout(()=>res('timeout'), 3000));
  Promise.race([Notification.requestPermission(), timeout]).then(perm=>{
    if(perm==='timeout'){
      if(status) status.textContent="Didn't get a response — try again.";
      state.settings.notifyBrowser=false;
    }else if(perm==='denied'){
      if(status) status.textContent="Blocked. Re-enable from browser site settings if needed.";
      state.settings.notifyBrowser=false;
    }else{
      state.settings.notifyBrowser = perm==='granted';
      if(status) status.textContent = perm==='granted' ? 'Enabled for this browser (only while the tab can run).' : '';
    }
    persistRender();
  }).catch(()=>{
    if(status) status.textContent="Couldn't enable notifications right now.";
    state.settings.notifyBrowser=false;
    persistRender();
  });
}
