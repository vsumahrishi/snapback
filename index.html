function icsEscape(s){ return String(s||'').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function nextWeekdayDateStr(dayIdx){
  const now=new Date();
  const cur=mondayIndex(now);
  let delta=(dayIdx-cur+7)%7;
  const d=new Date(now); d.setDate(now.getDate()+delta);
  return toDateStr(d);
}


function exportBackup(){
  try{
    const payload = {
      exportedAt: new Date().toISOString(),
      version: 1,
      state: state
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'snapback-backup-'+todayStr()+'.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2500);
    showAppMessage('Backup saved', 'File: snapback-backup-'+todayStr()+'.json — usually in your Downloads folder. Keep it in Drive/OneDrive or email it to yourself. To restore later: Settings → Backup & restore → Choose backup file & restore.');
  }catch(e){
    showAppMessage('Backup failed', String(e && e.message || e));
  }
}
function importBackupFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(String(reader.result||''));
      const incoming = data.state || data;
      if(!incoming || typeof incoming !== 'object'){
        showAppMessage('Invalid file', 'That does not look like a SnapBack backup.');
        return;
      }
      showAppMessage('Restore backup?', 'This replaces tasks, calendar, and settings on this device with the file.', {
        ok: 'Restore',
        cancel: 'Cancel',
        onOk: ()=>{
          const d = emptyState();
          state = Object.assign(d, incoming);
          state.settings = Object.assign(d.settings, incoming.settings||{});
          state.timer = Object.assign(d.timer, incoming.timer||{});
          if(state.timer) state.timer.running = false;
          persistRender();
          showAppMessage('Restored', 'Backup loaded on this device.');
        }
      });
    }catch(e){
      showAppMessage('Could not read backup', String(e && e.message || e));
    }
  };
  reader.readAsText(file);
}

function exportTaskICS(taskId){
  const t=findTask(taskId); if(!t || !t.date) return;
  const d=t.date.replace(/-/g,''); const start=(t.time||'09:00').replace(':','')+'00';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SnapBack//EN','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',`UID:task${t.id}@snapback`,`DTSTAMP:${icsStamp(new Date())}`,`DTSTART:${d}T${start}`,`DTEND:${d}T${start}`,`SUMMARY:${icsEscape(t.title)}`];
  if(t.meetingUrl) lines.push(`URL:${icsEscape(t.meetingUrl)}`);
  lines.push(...icsAlarm(15));
  lines.push('END:VEVENT','END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`snapback-${t.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase().slice(0,30)}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function icsAlarm(minutesBefore){
  return ['BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:SnapBack reminder`,`TRIGGER:-PT${minutesBefore}M`,'END:VALARM'];
}
function exportICS(){
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SnapBack//EN','CALSCALE:GREGORIAN'];
  const stamp=icsStamp(new Date());
  state.tasks.filter(t=>t.date && !t.done).forEach(t=>{
    const d=t.date.replace(/-/g,''); const start=(t.time||'09:00').replace(':','')+'00';
    lines.push('BEGIN:VEVENT',`UID:task${t.id}@focuspod`,`DTSTAMP:${stamp}`,`DTSTART:${d}T${start}`,`DTEND:${d}T${start}`,`SUMMARY:${icsEscape(t.title)}`);
    if(t.meetingUrl) lines.push(`URL:${icsEscape(t.meetingUrl)}`);
    lines.push(...icsAlarm(15));
    lines.push('END:VEVENT');
  });
  state.classes.forEach(c=>{
    if(c.scope==='session'){
      const ds=(c.date||todayStr()).replace(/-/g,'');
      lines.push('BEGIN:VEVENT',`UID:class${c.id}@snapback`,`DTSTAMP:${stamp}`,`DTSTART:${ds}T${c.start.replace(':','')}00`,`DTEND:${ds}T${c.end.replace(':','')}00`,`SUMMARY:${icsEscape(c.title)}`);
    }else{
      const ds=nextWeekdayDateStr(c.day).replace(/-/g,'');
      const rrule = c.semEnd ? `RRULE:FREQ=WEEKLY;UNTIL=${c.semEnd.replace(/-/g,'')}T235959Z` : 'RRULE:FREQ=WEEKLY;COUNT=16';
      lines.push('BEGIN:VEVENT',`UID:class${c.id}@snapback`,`DTSTAMP:${stamp}`,`DTSTART:${ds}T${c.start.replace(':','')}00`,`DTEND:${ds}T${c.end.replace(':','')}00`,rrule,`SUMMARY:${icsEscape(c.title)}`);
    }
    if(c.room) lines.push(`LOCATION:${icsEscape(c.room)}`);
    if(c.meetingUrl) lines.push(`URL:${icsEscape(c.meetingUrl)}`);
    lines.push(...icsAlarm(15));
    lines.push('END:VEVENT');
  });
  state.studyBlocks.forEach(b=>{
    const d=b.date.replace(/-/g,'');
    lines.push('BEGIN:VEVENT',`UID:block${b.id}@focuspod`,`DTSTAMP:${stamp}`,`DTSTART:${d}T${b.start.replace(':','')}00`,`DTEND:${d}T${b.end.replace(':','')}00`,`SUMMARY:${icsEscape(b.label)}`);
    if(b.meetingUrl) lines.push(`URL:${icsEscape(b.meetingUrl)}`);
    lines.push(...icsAlarm(15));
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='snapback-calendar.ics';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportWeekGrid(){
  // Simple printable week grid: days as rows, time blocks as columns, colour-coded free time
  const hours = [];
  for(let h=7; h<=21; h++) hours.push(String(h).padStart(2,'0')+':00');
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const ref = new Date((state.calRef||todayStr())+'T00:00:00');
  // Align to Monday of current week
  const day = ref.getDay(); // 0=Sun
  const mondayOffset = day===0 ? -6 : 1-day;
  const monday = new Date(ref); monday.setDate(ref.getDate()+mondayOffset);

  const weekDates = [];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    weekDates.push(toDateStr(d));
  }

  // Build occupancy map: date -> hour -> busy?
  const busy = {};
  weekDates.forEach(ds=>{
    busy[ds] = {};
    hours.forEach(h=> busy[ds][h]=false);
    itemsForDate(ds).forEach(it=>{
      if(!it.time) return;
      const startH = it.time.slice(0,2)+':00';
      if(busy[ds][startH]!==undefined) busy[ds][startH]=true;
      // mark a couple of hours if it looks like a class
      const idx = hours.indexOf(startH);
      if(idx>=0 && idx+1<hours.length) busy[ds][hours[idx+1]]=true;
    });
  });

  let html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>SnapBack Week Grid</title>
  <style>
    body{font-family:system-ui,sans-serif;padding:24px;color:#1E2422}
    h1{margin:0 0 4px} p{color:#6C766E;margin:0 0 18px}
    table{border-collapse:collapse;width:100%;font-size:13px}
    th,td{border:1px solid #DFDACD;padding:8px 6px;text-align:center}

    .free{background:#DDEAE4}
    .busy{background:#F5DDD7}
    .day{text-align:left;font-weight:700;white-space:nowrap}
    .legend{margin-top:16px;display:flex;gap:16px;font-size:13px}
    .swatch{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:4px;vertical-align:middle}
  </style>
<style id="tour-css">
.tour-overlay{position:fixed;inset:0;z-index:99999;background:rgba(15,25,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.tour-card{background:var(--card,#fff);border-radius:16px;padding:18px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);margin-bottom:max(12px,env(safe-area-inset-bottom))}
.tour-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;margin:0 3px}
.tour-dot.on{background:var(--pine,#2F5D50)}

#tourRoot{position:fixed;inset:0;z-index:99999;pointer-events:none}
#tourRoot .tour-overlay{pointer-events:auto}
</style>
</head><body>
  <h1>Week at a glance</h1>
  <p>Week of ${weekDates[0]} — free time is green, busy is red. Print or save as PDF.</p>
  <table><thead><tr><th>Day</th>${hours.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;

  weekDates.forEach((ds,i)=>{
    html += `<tr><td class="day">${dayNames[i]} ${ds.slice(5)}</td>`;
    hours.forEach(h=>{
      const isBusy = busy[ds][h];
      html += `<td class="${isBusy?'busy':'free'}">${isBusy?'●':''}</td>`;
    });
    html += `</tr>`;
  });

  html += `</tbody></table>
  <div class="legend">
    <span><span class="swatch" style="background:#DDEAE4"></span> Free</span>
    <span><span class="swatch" style="background:#F5DDD7"></span> Busy</span>
  </div>
  <script>window.onload=()=>window.print()<\/script>

  const w = window.open('','_blank');

}
function itemsForDate(dateStr){
  try{ collapseWorkoutCopies(); }catch(e){}
  const d=new Date(dateStr+'T00:00:00');
  const dow=mondayIndex(d);
  const items=[];
  state.classes.forEach(c=>{
    let show=false;
    if(c.scope==='session'){ show = c.date===dateStr; }
    else{ show = c.day===dow && (!c.semStart || dateStr>=c.semStart) && (!c.semEnd || dateStr<=c.semEnd); }
    if(show && Array.isArray(c.exdates) && c.exdates.indexOf(dateStr)>=0) show=false;
    if(show) items.push({type:'class', kind:'class', id:c.id, color:'var(--blue)', time:c.start, end:c.end||'', label:c.title+(c.room?' · '+c.room:''), meetingUrl:c.meetingUrl, seriesId:c.seriesId||'', source:c.source||''});
  });
  state.tasks.filter(t=>t.date===dateStr).forEach(t=>items.push({type:'task', kind:'task', id:t.id, color: t.priority==='high'?'var(--brick)':t.priority==='medium'?'var(--amber)':'var(--pine)',time:t.time||'',label:t.title,meetingUrl:t.meetingUrl}));
  state.tasks.filter(t=>t.startDate===dateStr && t.startDate!==t.date).forEach(t=>items.push({type:'taskstart', kind:'task', id:t.id, color:'var(--blue-soft)',time:t.startTime||'',label:t.title,meetingUrl:t.meetingUrl}));
  state.studyBlocks.filter(b=>b.date===dateStr).forEach(b=>items.push({type:'block', kind:'block', id:b.id, color:'var(--purple)', time:b.start, end:b.end||'', label:b.label, meetingUrl:b.meetingUrl, seriesId:b.seriesId||'', source:b.source||''}));
  (state.externalBusy||[]).forEach(ev=>{
    if(ev.date!==dateStr) return;
    if(!ev.id) ev.id='ext_'+dateStr+'_'+(ev.start||'')+'_'+(ev.title||'');
    items.push({type:'external', kind:'external', id:ev.id, color:'var(--blue)',time:ev.allDay?'':(ev.start||''),end:ev.allDay?'':(ev.end||''),label:(ev.title||'Busy'),meetingUrl:''});
  });
  if(state.nonNegotiable[dateStr]) items.push({type:'nn',color:'var(--gold)',time:'',label:'★ '+state.nonNegotiable[dateStr].text});
  const seen={};
  const ranked=items.slice().sort(function(a,b){
    const ka=(meetingKey(a.label||'')||'')+'|'+String(a.time||'').slice(0,5);
    const kb=(meetingKey(b.label||'')||'')+'|'+String(b.time||'').slice(0,5);
    if(ka===kb) return String(a.label||'').length-String(b.label||'').length;
    return String(a.time||'').localeCompare(String(b.time||''));
  });
  const deduped=ranked.filter(it=>{
    const mk=meetingKey(it.label||'')||cleanCalTitle(it.label||'').toLowerCase();
    const k=String(it.time||'').slice(0,5)+'|'+mk;
    if(!mk) return true;
    if(seen[k]) return false;
    seen[k]=1;
    return true;
  });
  const planTitles={};
  (state.exercisePlan||[]).forEach(function(r){
    if(Number(r.day)!==Number(dow)) return;
    planTitles[normExTitle(exerciseTaskTitle(r))]=1;
  });
  const best={};
  const out=[];
  deduped.forEach(function(it){
    const k=normExTitle(it.label||'');
    if(!k || !planTitles[k]){ out.push(it); return; }
    if(best[k]==null){ best[k]=out.length; out.push(it); return; }
    if(String(it.time||'')>=String(out[best[k]].time||'')) out[best[k]]=it;
  });
  return out.sort((a,b)=>(a.time||'').localeCompare(b.time||''));
}

function cleanCalTitle(s){
  let t=String(s||'').replace(/\s+/g,' ').trim();
  t=t.replace(/^(ET|EST|EDT|CT|CST|CDT|MT|MST|MDT|PT|PST|PDT|IST|GMT|UTC|BST)\s*[-–:]\s*/i,'');
  t=t.replace(/\s*\/\s*/g,' / ');
  return t.trim();
}
function calTitleKey(s){ return cleanCalTitle(s).toLowerCase(); }
function calMinutes(t){
  if(!t || !/^\d{1,2}:\d{2}/.test(String(t))) return null;
  const p=String(t).slice(0,5).split(':').map(Number);
  return p[0]*60+(p[1]||0);
}
function calTimesOverlap(aStart,aEnd,bStart,bEnd){
  const as=calMinutes(aStart), bs=calMinutes(bStart);
  if(as==null || bs==null) return false;
  const ae=calMinutes(aEnd); const be=calMinutes(bEnd);
  const a2=ae==null||ae<=as ? as+60 : ae;
  const b2=be==null||be<=bs ? bs+60 : be;
  return as<b2 && bs<a2;
}
function classCoversDate(c, dateStr){
  if(!c || c.scope==='session') return c && c.date===dateStr;
  const dow=mondayIndex(new Date(dateStr+'T12:00:00'));
  if(c.day!==dow) return false;
  if(c.semStart && dateStr<c.semStart) return false;
  if(c.semEnd && dateStr>c.semEnd) return false;
  if(Array.isArray(c.exdates) && c.exdates.indexOf(dateStr)>=0) return false;
  return true;
}
function apptSourceLabel(it){
  if(!it) return 'Appointment';
  let rec=null;
  if(it.kind==='class') rec=(state.classes||[]).find(function(x){ return String(x.id)===String(it.id); });
  else if(it.kind==='task') rec=(state.tasks||[]).find(function(x){ return String(x.id)===String(it.id); });
  else rec=(state.studyBlocks||[]).find(function(x){ return String(x.id)===String(it.id); });
  const src=rec&&rec.source||'';
  const fromFile=src==='ics-file'||src==='ics'||!!(rec&&rec.importBatch);
  return (fromFile?'From the calendar file: ':'Already in SnapBack: ')+(it.title||'Appointment');
}
function meetingKey(s){
  let t=cleanCalTitle(s);
  t=t.replace(/\s*[·•|]\s*(microsoft teams meeting|teams meeting|zoom meeting|google meet).*$/i,'').trim();
  t=t.replace(/\b(microsoft teams meeting|teams meeting|zoom meeting|google meet)\b/ig,'').trim();
  t=t.replace(/^[A-Z0-9]{2,10}\s*[-–:]\s*/,'');
  t=t.replace(/^[A-Z]{2,6}\s+/,'');
  const parts=t.toLowerCase().split(/\s*\/\s*/).map(function(p){ return p.trim(); }).filter(Boolean).sort();
  return parts.join(' / ');
}
function queueTwinChoices(){
  if(state._twinAskV!==2) state._twinAskV=2;
  const bySlot={};
  function add(it){
    const key=meetingKey(it.title);
    if(!key || !it.date) return;
    const g=it.date+'|'+String(it.start||'').slice(0,5)+'|'+key;
    if(!bySlot[g]) bySlot[g]=[];
    bySlot[g].push(it);
  }
  (state.studyBlocks||[]).forEach(function(b){
    add({date:b.date, start:b.start||'', end:b.end||'', title:b.label, kind:'block', id:b.id, seriesId:b.seriesId||''});
  });
  (state.classes||[]).forEach(function(c){
    for(let i=0;i<90;i++){
      const ds=icsAddDays(todayStr(), i);
      if(!classCoversDate(c, ds)) continue;
      add({date:ds, start:c.start||'', end:c.end||'', title:c.title, kind:'class', id:c.id, seriesId:c.seriesId||''});
    }
  });

    const idx = line.lastIndexOf(':');
    if(idx<0) continue;
    return line.slice(idx+1).trim().replace(/\\n/g,' ').replace(/\\,/g,',').replace(/\\\\/g,'\\');
  }

}
function icsWhen(raw){

    const dt = new Date(Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5]||0));

function importICSFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const buf=reader.result;
      const bytes=new Uint8Array(buf);
      let text='';
      if(bytes.length>2 && bytes[0]===0xFF && bytes[1]===0xFE) text=new TextDecoder('utf-16le').decode(buf);
      else if(bytes.length>2 && bytes[0]===0xFE && bytes[1]===0xFF) text=new TextDecoder('utf-16be').decode(buf);
      else {
        text=new TextDecoder('utf-8').decode(buf);
        if(text.indexOf('BEGIN:VEVENT')<0){
          const alt=new TextDecoder('utf-16le').decode(buf);
          if(alt.indexOf('BEGIN:VEVENT')>=0) text=alt;
        }
      }
      const result = importIcsText(text, 'ics-file');
      if(!result.ok){ showAppMessage('Calendar not imported', result.message); return; }
      if(result.questions){
        try{ persistRender(); }catch(e){ try{ render(); }catch(e2){} }
      } else {
        showAppMessage('Calendar uploaded', 'Your calendar has been updated.');
      }
    }catch(e){
      console.error(e);
      showAppMessage('Could not read file', 'Save the download as a .ics file, choose it, then tap Upload calendar file.');
    }
  };
  reader.readAsArrayBuffer(file);
}

    busy.push({start,end,label:it.label});
  });
  const free = [];
  let t = dayStart;
  while(t < dayEnd){
    const slotEnd = t + step;
    const overlaps = busy.some(b => t < b.end && slotEnd > b.start);
    if(!overlaps){
      const pad=n=>String(n).padStart(2,'0');
      free.push(pad(Math.floor(t/60))+':'+pad(t%60)+'–'+pad(Math.floor(slotEnd/60))+':'+pad(slotEnd%60));
    }
    t += step;
  }
  // merge consecutive free slots for readability
  const merged = [];
  for(const s of free){
    if(!merged.length){ merged.push(s); continue; }
    const prev = merged[merged.length-1];
    const prevEnd = prev.split('–')[1];
    const curStart = s.split('–')[0];
    if(prevEnd === curStart){
      merged[merged.length-1] = prev.split('–')[0]+'–'+s.split('–')[1];
    } else merged.push(s);
  }
  return merged;
}


/* ============================================================
   Share free/busy week (link anyone can open)
   ============================================================ */
function b64urlEncode(str){
  try{
    const b = btoa(unescape(encodeURIComponent(str)));
    return b.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }catch(e){ return ''; }
}
function b64urlDecode(str){
  try{
    let s = String(str||'').replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    return decodeURIComponent(escape(atob(s)));
  }catch(e){ return ''; }
}
function mondayOf(dateObj){
  const d = new Date(dateObj); d.setHours(12,0,0,0);
  const day = (d.getDay()+6)%7; // Mon=0
  d.setDate(d.getDate()-day);
  return d;
}
function isoDate(d){
  const x=new Date(d);
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
}
/** Busy blocks for a week starting Monday (from classes + timed tasks) */
function buildWeekBusyData(weekStart, showDetails){
  const show = !!showDetails;
  const mon = mondayOf(weekStart||new Date());
  const days = [];
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  for(let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const ds = isoDate(d);
    const busy = [];
    (state.classes||[]).forEach(c=>{
      const onDay = (c.day!=null && Number(c.day)===i) || (c.scope==='session' && c.date===ds);
      if(!onDay || !c.start) return;
      const block = { start: c.start||'', end: c.end||'' };
      if(show){
        block.title = c.title||c.name||'Busy';
        block.place = c.room||c.place||'';
      }
      busy.push(block);
    });
    (state.tasks||[]).forEach(task=>{
      if(task.done) return;
      if(task.date!==ds || !task.time) return;
      const startT = task.time;
      let endT = '';
      try{
        const parts = startT.split(':').map(Number);
        const m = (parts[0]*60+(parts[1]||0)+60);
        endT = String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
      }catch(e){}
      const block = { start: startT, end: endT };
      if(show){ block.title = task.title||'Busy'; block.place = ''; }
      busy.push(block);
    });
    (state.externalBusy||[]).forEach(ev=>{
      if(ev.date!==ds || !ev.start) return;
      const block = { start: ev.start||'', end: ev.end||'' };
      if(show){ block.title = (ev.title||'Busy')+(ev.source?(' · '+ev.source):''); block.place = ''; }
      busy.push(block);
    });
    busy.sort((a,b)=>String(a.start).localeCompare(String(b.start)));
    days.push({ name: dayNames[i], date: ds, busy });
  }
  const name = (state.profile && state.profile.name) || (state.settings && state.settings.displayName) || 'Someone';
  return {
    v: 3,
    name: String(name).slice(0,40),
    weekStart: isoDate(mon),
    showDetails: show,
    days
  };
}
function buildShareWeekLink(weekStart){
  const show = state.shareShowDetails === true;
  const data = buildWeekBusyData(weekStart, show);
  // Compact: m=0 mask (busy/free only), m=1 with titles
  const compact = {
    v:3,
    n: data.name||'',
    w: data.weekStart||'',
    m: show ? 1 : 0,
    d: (data.days||[]).map(function(day){
      return {
        a: day.date,
        b: (day.busy||[]).map(function(x){
          if(show) return [x.start||'', x.end||'', x.title||'', x.place||''];
          return [x.start||'', x.end||''];
        })
      };
    })
  };
  const payload = b64urlEncode(JSON.stringify(compact));
  const base = (typeof location!=='undefined' && location.origin && location.pathname)
    ? (location.origin + location.pathname.split('#')[0].split('?')[0])
    : '';
  // Query param (not hash) so short-link services preserve the data
  return base + '?fb=' + payload;
}
/** Expand compact or legacy free/busy payload */
function expandFreeBusyPayload(data){
  if(!data) return null;
  const dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  if(data.days){
    const show = data.showDetails === true || data.m === 1;
    return {
      v: data.v||3,
      name: data.name||'Someone',
      weekStart: data.weekStart||'',
      showDetails: show,
      days: (data.days||[]).map(function(day){
        return {
          name: day.name||'',
          date: day.date||'',
          busy: (day.busy||[]).map(function(x){
            const o = { start: x.start||'', end: x.end||'' };
            if(show){ o.title = x.title||''; o.place = x.place||''; }
            return o;
          })
        };
      })
    };
  }
  if(data.d){
    const show = data.m === 1;
    return {
      v: data.v||3,
      name: data.n||'Someone',
      weekStart: data.w||'',
      showDetails: show,
      days: (data.d||[]).map(function(day,i){
        return {
          name: dayNames[i]||'',
          date: day.a||'',
          busy: (day.b||[]).map(function(row){
            const o = { start:row[0]||'', end:row[1]||'' };
            if(show){ o.title = row[2]||''; o.place = row[3]||''; }
            return o;
          })
        };
      })
    };
  }
  return null;
}
function newShareId(){
  const chars='abcdefghijkmnopqrstuvwxyz23456789';
  let s='';
  for(let i=0;i<7;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
async function shortenUrl(longUrl){
  // Short link is on your own SnapBack site (?s=abc1234).
  // The calendar data is stored in Firebase. No third-party shortener.
  try{
    const parts=String(longUrl||'').split('?fb=');
    if(parts.length<2 || !parts[1]) return longUrl;
    if(typeof initFirebase==='function') initFirebase();
    if(typeof _db==='undefined' || !_db) return longUrl;
    const id=newShareId();
    await _db.collection('publicShares').doc(id).set({
      fb: parts[1],
      created: Date.now()
    });
    return parts[0]+'?s='+id;
  }catch(e){
    return longUrl;
  }
}
async function resolveShortShare(){
  try{
    const q=new URLSearchParams(String(location.search||''));
    const id=(q.get('s')||'').trim();
    if(!id || !/^[a-z0-9]{5,12}$/i.test(id)) return;
    if(state._shareResolved===id && state.freeBusyPublic) return;
    if(typeof initFirebase==='function') initFirebase();
    if(typeof _db==='undefined' || !_db) return;
    const snap=await _db.collection('publicShares').doc(id).get();
    if(!snap.exists) return;
    const fb=snap.data()&&snap.data().fb;
    if(!fb) return;
    const json=b64urlDecode(fb);
    if(!json) return;
    state.freeBusyPublic=expandFreeBusyPayload(JSON.parse(json));
    state.view='freebusy';
    state._shareResolved=id;
    try{ persistRender(); }catch(e){ try{ render(); }catch(e2){} }
  }catch(e){}
}

function parseFreeBusyFromHash(){
  try{
    // Prefer ?fb= (short-link friendly)
    const q = String(location.search||'');

    if(!m){
      const h = String(location.hash||'');
      m = h.match(/#\/freebusy\/([A-Za-z0-9_-]+)/);

function calRepeats(d){

function clearExcludedCopies(){

function dropCopiesOnDate(date, title, start){
  const lab=calTitleKey(title);
  (state.classes||[]).forEach(c=>{
    if(calTitleKey(c.title)!==lab) return;
    if(!sameCalTime(c.start, start)) return;
    if(!Array.isArray(c.exdates)) c.exdates=[];
    if(c.exdates.indexOf(date)<0) c.exdates.push(date);
  });
  state.studyBlocks=(state.studyBlocks||[]).filter(b=>{
    if(b.date!==date) return true;
    if(calTitleKey(b.label)!==lab) return true;
    if(!sameCalTime(b.start, start)) return true;
    return false;
  });
  state.externalBusy=(state.externalBusy||[]).filter(b=>{
    if(b.date!==date) return true;
    if(calTitleKey(b.title||b.label)!==lab) return true;

function removeTasksForSchedule(d, scope){
  if(!d) return;
  const date=d.date||'';
  const title=d.title||d.label||'';
  const start=String(d.start||'').slice(0,5);
  const id=d.id;
  state.tasks=(state.tasks||[]).filter(function(t){
    const linked=id && (String(t.studyBlockId)===String(id) || String(t.classId)===String(id) || String(t.scheduleId)===String(id));
    const named=title && cleanCalTitle(t.title||'').toLowerCase()===cleanCalTitle(title).toLowerCase() && (!start || !t.time || String(t.time).slice(0,5)===start);
    if(!linked && !named) return true;
    if(scope==='following'){
      if(t.date && date && t.date<date) return true;
      return false;
    }
    if(t.date && date && t.date!==date) return true;
    return false;
  });

function relinkScheduleTasks(oldDraft, neu){
  if(!oldDraft) return;
  const oldTitle=cleanCalTitle(oldDraft.title||'').toLowerCase();
  const oldStart=String(oldDraft.start||'').slice(0,5);
  (state.tasks||[]).forEach(function(t){
    const linked=oldDraft.id && (String(t.studyBlockId)===String(oldDraft.id) || String(t.classId)===String(oldDraft.id) || String(t.scheduleId)===String(oldDraft.id));
    const named=oldTitle && cleanCalTitle(t.title||'').toLowerCase()===oldTitle && (!oldStart || !t.time || String(t.time).slice(0,5)===oldStart) && (!oldDraft.date || !t.date || t.date===oldDraft.date);
    if(!linked && !named) return;
    t.title=neu.title;
    if(neu.start) t.time=neu.start;
    if(neu.repeat==='weekly'){
      t.classId=neu.id;
      t.studyBlockId='';
      t.date=nextDateForDow(neu.day);
    } else {
      t.studyBlockId=neu.id;
      t.classId='';
      if(neu.date) t.date=neu.date;

function deleteCalFollowing(){

  const mk=meetingKey(d.title);

    else c.semEnd=prev;

    else if(mk && meetingKey(c.title)===mk && sameCalTime(c.start, d.start)) endClass(c);
  });
  state.classes=(state.classes||[]).filter(c=>!c._drop);
  state.studyBlocks=(state.studyBlocks||[]).filter(b=>{

    if(d.kind==='block' && String(b.id)===String(d.id)) return false;
    if(d.seriesId && b.seriesId===d.seriesId) return false;

  </div>
  ${schedBox('glance','Quick glance', `
  <div class="calnav">
      <button class="btn ghost sm" id="calPrev">&larr;</button>

  ${schedBox('bring','Bring in my calendar', `

  ${schedBox('free','Free slots', `

/* ============================================================
   VIEW: Reminders
   ============================================================ */
function viewReminders(){
  const upcoming = state.tasks.filter(t=>!t.done && t.date).map(t=>({...t,du:daysUntil(t.date)})).sort((a,b)=>a.du-b.du);
  const leadLabel={7:'1wk before',3:'3d before',1:'1d before',0:'day of'};
  const dlRow=(t)=>{
    const label = t.du<0 ? `${Math.abs(t.du)}d overdue` : t.du===0 ? 'Due today' : t.du===1 ? 'Due tomorrow' : `In ${t.du} days`;
    const cls = t.du<0 ? 'overdue' : t.du<=1 ? 'dueToday' : t.du<=3 ? 'medium' : 'low';
    const leads=(t.reminderLeads||[]).slice().sort((a,b)=>b-a).map(d=>leadLabel[d]).join(', ');
    return `<div class="deadline-row"><span class="badge ${cls}">${label}</span><span style="flex:1">${escapeHtml(t.title)}<div style="font-size:.72rem;color:var(--muted)">${escapeHtml(t.date)}${t.time?(' · '+t.time):''} ${leads?('· reminds: '+leads+' at '+(t.reminderTime||'09:00')):'· no reminders set — edit on Tasks'}</div></span></div>`;
  };
  const now=Date.now();
  const remRow=(r)=>{
    const when=new Date(r.when);
    const overdue = when.getTime()<now && !r.done;
    return `<div class="deadline-row">
      <input type="checkbox" class="check" ${r.done?'checked':''} data-action="toggle-reminder" data-id="${r.id}">
      <span style="flex:1;${r.done?'text-decoration:line-through;opacity:.6':''}">${escapeHtml(r.title)}<div style="font-size:.72rem;color:${overdue?'var(--brick)':'var(--muted)'}">${when.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}${overdue?' · passed':''}</div></span>
      ${deleteControl('reminder', r.id, 'Delete')}
    </div>`;
  };
  return `
  <div class="pagehead"><div class="eyebrow">Catch it before it's urgent</div><h1>Reminders</h1><p>Set right on each task (Tasks page) — no separate entry needed. New tasks default to 1 week / 3 days / 1 day / day-of; adjust the chips per task.</p></div>

  <p style="font-size:.82rem;color:var(--muted)">Note: this only checks the time while the page is open, like a kitchen timer rather than a phone alarm. For a real alarm even when this is closed, use <b>Export calendar file</b> on the Calendar page.</p>

  <div class="card">
    <h3>What's coming up</h3>
    ${upcoming.length ? upcoming.map(dlRow).join('') : '<div class="empty">No dated tasks yet — add dates on the Tasks page.</div>'}
  </div>

  <div class="card">
    <h3>Other reminders <span style="font-weight:400;color:var(--muted);font-size:.8rem">(not linked to a task)</span></h3>
    <p style="color:var(--muted);font-size:.85rem;margin-top:-4px">For things that aren't a task — "email advisor", "renew library book", etc.</p>
    <div class="row">
      <div class="field" style="flex:2"><label>Reminder</label><input id="remTitle" placeholder="What should I remind you about?"></div>
      <div class="field"><label>Date</label><input id="remDate" type="date" value="${todayStr()}"></div>
      <div class="field"><label>Time</label><input id="remTime" type="time" value="09:00"></div>
    </div>
    <button class="btn" id="addReminderBtn">Add reminder</button>
    <div style="margin-top:12px">${state.customReminders.length ? state.customReminders.slice().sort((a,b)=>a.when.localeCompare(b.when)).map(remRow).join('') : '<div class="empty">No custom reminders yet.</div>'}</div>
  </div>`;
}

/* ============================================================
   VIEW: Money
   ============================================================ */
function moneyMonthLabel(ym){
  const [y,m]=ym.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
}
function moneyExportCSV(){
  const rows=[['Date','Title','Type','Category','Amount']];
  state.money.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(m=>rows.push([m.date,m.title,m.type,m.category,m.amount]));
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='snapback-money.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function moneyCopySummary(){
  const ym=state.moneyMonth;
  const entries=state.money.filter(m=>m.date.slice(0,7)===ym);
  const spent=entries.filter(m=>m.type==='expense').reduce((a,b)=>a+b.amount,0);
  const earned=entries.filter(m=>m.type==='income').reduce((a,b)=>a+b.amount,0);
  const byCat={};
  entries.filter(m=>m.type==='expense').forEach(m=>{ byCat[m.category]=(byCat[m.category]||0)+m.amount; });
  let text=`${moneyMonthLabel(ym)} — spending summary\nSpent: ₹${spent.toFixed(0)}\nReceived: ₹${earned.toFixed(0)}\nNet: ₹${(earned-spent).toFixed(0)}\n\nBy category:\n`;
  text += Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([cat,amt])=>`- ${cat}: ₹${amt.toFixed(0)}`).join('\n') || '(no expenses)';
  const status=document.getElementById('moneyCopyStatus');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{ if(status) status.textContent='Copied — paste it into a message to send.'; })
      .catch(()=>{ if(status) status.textContent="Couldn't copy automatically — use Export CSV instead."; });
  }else if(status){ status.textContent="Clipboard isn't available here — use Export CSV instead."; }
}

   ============================================================ */

function loadTesseract(){
  return new Promise((resolve, reject)=>{
    if(window.Tesseract){ resolve(window.Tesseract); return; }
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>resolve(window.Tesseract);
    s.onerror=()=>reject(new Error('Could not load OCR library (need internet once)'));
    document.head.appendChild(s);
  });
}
async function ocrTimetableImage(file){
  const status=document.getElementById('ttOcrStatus');
  const area=document.getElementById('ttPaste');
  if(status) status.textContent='Loading OCR… (first time may take a moment)';
  const Tesseract=await loadTesseract();
  if(status) status.textContent='Reading image…';
  const result=await Tesseract.recognize(file, 'eng', {
    logger: m=>{
      if(!status) return;
      if(m.status==='recognizing text' && m.progress!=null){
        status.textContent='Reading image… '+Math.round(m.progress*100)+'%';
      } else if(m.status){
        status.textContent=m.status;
      }
    }
  });
  let text=(result && result.data && result.data.text) ? result.data.text.trim() : '';
  // Light cleanup of common OCR noise on timetables
  text = text
    .replace(/[~|\[\]]+/g, ' ')
    .replace(/[|]{1,}/g, ' ')
    .replace(/[☐☑□■●○•]+/g, ' ')
    // 830-1240 or 830 - 1240 → 8:30-12:40 ; 230 → 2:30
    .replace(/\b(\d{1,2})([0-5]\d)\s*[-–—to]+\s*(\d{1,2})([0-5]\d)\b/g, '$1:$2-$3:$4')
    .replace(/\b(\d{1,2})([0-5]\d)\b/g, (m,h,min)=>{
      const hh=parseInt(h,10); if(hh>23) return m; return hh+':'+min;
    })
    .replace(/(\d{1,2})[\.,](\d{2})/g, '$1:$2')
    .replace(/[ \t]+/g, ' ')
    .replace(/ *\n */g, '\n')
    .trim();
  if(area) area.value = text;
  const hasDay = /\b(mon|tue|wed|thu|fri|sat|sun)/i.test(text);
  const hasTime = /\d{1,2}\s*[:.]\s*\d{2}/.test(text);
  if(status){
    if(!text){
      status.textContent = 'No text found. Paste the grid from Excel instead (more accurate for tables).';
    } else if(!hasDay || !hasTime){
      status.textContent = 'OCR could not read days/times clearly. Please paste from Excel (select cells → Copy → Paste here), or edit the text box by hand, then Preview.';
    } else {
      status.textContent = 'Done — fix any wrong names/times in the box below, then Preview. For Excel grids, paste is usually more accurate than a screenshot.';
    }
  }
  return text;
}

function parseTimeRangeToken(str){
  const s = String(str||'').toLowerCase().trim();
  // 3:15 - 4:00 | 5:45-6:30 | 5:00 - 5:45 / 6:00 (take first range)
  const m = s.match(/(\d{1,2})[:.](\d{2})\s*[-–—to]+\s*(\d{1,2})[:.](\d{2})/);
  if(!m) return null;
  function schoolH(h){ h=parseInt(h,10); if(h>=1&&h<=6) h+=12; return h; }
  const pad=(n)=>String(n).padStart(2,'0');
  return {start: pad(schoolH(m[1]))+':'+m[2], end: pad(schoolH(m[3]))+':'+m[4]};
}
function dayNameToIndex(word){
  const k = String(word||'').toLowerCase().replace(/[^a-z]/g,'');
  if(k.startsWith('mon')) return 0;
  if(k.startsWith('tue')) return 1;
  if(k.startsWith('wed')) return 2;
  if(k.startsWith('thu')) return 3;
  if(k.startsWith('fri')) return 4;
  if(k.startsWith('sat')) return 5;
  if(k.startsWith('sun')) return 6;
  return -1;
}
function parseExcelGridTimetable(raw){
  // Tab grids OR single-space Excel paste:
  // 3:15 - 4:00 4:00 - 4:45 5:00 - 5:45
  // Monday Neel Shreyas / Vedha Shlok Lakshya
  const src = String(raw||'').replace(/\u00a0/g,' ');
  const lines = src.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length < 2) return null;

  function schoolH(h){ h=parseInt(h,10); if(h>=1&&h<=6) h+=12; return h; }
  function pad(n){ return String(n).padStart(2,'0'); }
  function extractRanges(line){
    const re=/(\d{1,2})[:.](\d{2})\s*[-–—to]+\s*(\d{1,2})[:.](\d{2})/g;
    const out=[]; let m;
    while((m=re.exec(line))){
      out.push({start:pad(schoolH(m[1]))+':'+m[2], end:pad(schoolH(m[3]))+':'+m[4]});
    }
    return out;
  }
  function splitNameCells(rest){
    rest = rest.replace(/(\S)\s*\/\s*/g, '$1 / ');
    const parts = rest.trim().split(/\s+/).filter(Boolean);
    const cells=[];
    let i=0;
    while(i<parts.length){
      let cell=parts[i++];
      while(i<parts.length && (parts[i]==='/' || /\/$/.test(cell))){
        if(parts[i]==='/'){ cell += ' / '; i++; if(i<parts.length) cell += parts[i++]; }
        else { cell += parts[i++]; }
      }
      if(/^\d{1,2}:\d{2}$/.test(cell) || cell==='-') continue;
      cells.push(cell.replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').trim());
    }
    return cells;
  }

  let times=[], headerIdx=-1;
  for(let i=0;i<Math.min(5,lines.length);i++){
    const r=extractRanges(lines[i]);
    if(r.length>=2){ times=r; headerIdx=i; break; }
  }
  if(headerIdx<0||!times.length) return null;

  const results=[];
  for(let r=headerIdx+1;r<lines.length;r++){
    const line=lines[r];
    const dayMatch=line.match(/^(monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat|sunday|sun)\b/i);
    if(!dayMatch) continue;
    const day=dayNameToIndex(dayMatch[1]);
    if(day<0) continue;
    let rest=line.slice(dayMatch[0].length).trim();
    rest=rest.replace(/(\d{1,2})[:.](\d{2})\s*[-–—to]+\s*(\d{1,2})[:.](\d{2})/g,' ').trim();
    if(!rest) continue;
    const cells=splitNameCells(rest);
    const offset=Math.max(0, times.length-cells.length);
    cells.forEach((title,i)=>{
      const ti=i+offset;
      if(ti>=times.length||!title) return;
      results.push({title, day, start:times[ti].start, end:times[ti].end, room:'', scope:'semester'});
    });
  }
  return results.length?results:null;
}

function parseNotionListTimetable(raw){
  // Notion markdown: ## Mon, - [ ] 8:30: Title, *Room*
  let src = String(raw||'')
    .replace(/\u00a0/g, ' ')
    .replace(/^#{1,6}\s*/gm, '')
    .replace(/^\s*[-*+]\s*\[[ xX]?\]\s*/gm, '')
    .replace(/^\s*[-*+]\s+/gm, '')
    .replace(/\*+([^*]+)\*+/g, '$1')
    .replace(/_([^_]+)_/g, '$1');
  src = src.replace(/\b(Mondays?|Mon|Tuesdays?|Tues|Tue|Wednesdays?|Wed|Thursdays?|Thurs|Thur|Thu|Fridays?|Fri|Saturdays?|Sat|Sundays?|Sun)\b/gi, '\n$1\n');
  const lines = src.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
  if(lines.length < 2) return null;

  const dayRe = /^(monday|mon|tuesday|tues|tue|wednesday|wed|thursday|thurs|thur|thu|friday|fri|saturday|sat|sunday|sun)\b/i;
  let currentDay = -1;
  let dayHits = 0;
  const results = [];
  let pending = null;

  function flush(){ if(pending){ results.push(pending); pending=null; } }
  function toDay(w){
    const k=String(w||'').toLowerCase();
    if(k.startsWith('mon')) return 0;
    if(k.startsWith('tue')) return 1;
    if(k.startsWith('wed')) return 2;
    if(k.startsWith('thu')) return 3;
    if(k.startsWith('fri')) return 4;
    if(k.startsWith('sat')) return 5;
    if(k.startsWith('sun')) return 6;
    return -1;
  }
  // 1:00–6:59 with no am/pm → PM (school afternoon)
  function schoolTime(h, min, ap){
    let hour = parseInt(h,10);
    const mi = (min!=null && min!=='') ? parseInt(min,10) : 0;
    const a = (ap||'').toLowerCase();
    if(a==='pm' && hour<12) hour += 12;
    else if(a==='am' && hour===12) hour = 0;
    else if(!a && hour>=1 && hour<=6) hour += 12;
    if(hour>23||mi>59) return null;
    const pad=n=>String(n).padStart(2,'0');
    return pad(hour)+':'+pad(mi);
  }
  function parseLineTimes(line){
    let m = line.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\s*[-–—to]+\s*(\d{1,2}):(\d{2})\s*(am|pm)?\b/i);
    if(m){
      const start = schoolTime(m[1], m[2], m[3]);
      const end = schoolTime(m[4], m[5], m[6]||m[3]);
      if(start&&end) return {start, end, index:m.index, length:m[0].length};
    }
    m = line.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/i);
    if(m){
      const start = schoolTime(m[1], m[2], m[3]);
      if(!start) return null;
      const [hh,mm]=start.split(':').map(Number);
      const pad=n=>String(n).padStart(2,'0');
      return {start, end:pad((hh+1)%24)+':'+pad(mm), index:m.index, length:m[0].length};
    }
    return null;
  }

  for(const line of lines){
    const dm = line.match(dayRe);
    if(dm && line.replace(dayRe,'').replace(/[^\w]/g,'').length < 2){
      flush();
      currentDay = toDay(dm[1]);
      if(currentDay>=0) dayHits++;
      continue;
    }
    if(currentDay < 0){
      if(dm){ currentDay = toDay(dm[1]); if(currentDay>=0) dayHits++; }
      else continue;
    } else if(dm && line.replace(dayRe,'').trim().length > 2){
      currentDay = toDay(dm[1]);
      dayHits++;
    }
    const tm = parseLineTimes(line);
    if(tm){
      flush();
      let title = (line.slice(0, tm.index) + ' ' + line.slice(tm.index + tm.length))
        .replace(dayRe,'').replace(/\[\]/g,'').replace(/^[\s:\-–—]+|[\s:\-–—]+$/g,'').trim();
      if(!title) title = 'Class';
      pending = {title, day:currentDay, start:tm.start, end:tm.end, room:'', scope:'semester'};
      continue;
    }
    // Room line: no HH:MM, not a day, not mostly digits
    if(pending && line.length < 80 && !/\d{1,2}:\d{2}/.test(line) && !dayRe.test(line)){
      pending.room = line;
      flush();
    }
  }
  flush();
  if(dayHits >= 1 && results.length >= 1) return results;
  return null;
}


function parseDatedOneOffs(raw){
  // Finds: Title + time + on 26th / on the 26th / on 26
  // Multiple clauses joined by "and"
  let text = String(raw||'').replace(/\b(\d{1,2})[.:](\d{2})\b/g,'$1:$2');
  // Split on "and" when followed by time-ish or "at"
  const parts = text.split(/\band\b/i).map(s=>s.trim()).filter(Boolean);
  const clauses = parts.length > 1 ? parts : [text];
  const results = [];
  let carryTitle = '';

  function resolveDay(dom){
    const n = parseInt(dom,10);
    if(!(n>=1 && n<=31)) return null;
    const now = new Date();
    let y = now.getFullYear(), m = now.getMonth(); // 0-based
    let candidate = new Date(y, m, n, 12, 0, 0);
    // if that date already passed this month, try next month
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if(candidate < today0){
      m += 1;
      if(m>11){ m=0; y+=1; }
      candidate = new Date(y, m, n, 12, 0, 0);
    }
    return toDateStr(candidate);
  }

  function parseTimeIn(s){
    let m = s.match(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/i);
    if(m){
      let h=parseInt(m[1],10), min=parseInt(m[2],10);
      const ap=(m[3]||'').toLowerCase();
      let amb=!ap;
      if(ap==='pm'&&h<12) h+=12;
      else if(ap==='am'&&h===12) h=0;
      else if(!ap && h>=1 && h<=9) h+=12;
      const pad=x=>String(x).padStart(2,'0');
      const start=pad(h)+':'+pad(min);
      const end=pad((h+1)%24)+':'+pad(min);
      return {start, end, ambiguous:amb};
    }
    m = s.match(/\b(?:at\s+)?(\d{1,2})(?!:\d{2})\s*(am|pm)?\b/i);
    if(m){
      let h=parseInt(m[1],10);
      const ap=(m[2]||'').toLowerCase();
      let amb=!ap;
      if(ap==='pm'&&h<12) h+=12;
      else if(ap==='am'&&h===12) h=0;
      else if(!ap && h>=1 && h<=9) h+=12;
      const pad=x=>String(x).padStart(2,'0');
      return {start:pad(h)+':00', end:pad((h+1)%24)+':00', ambiguous:amb};
    }
    return null;
  }

  for(let i=0;i<clauses.length;i++){
    let clause = clauses[i];
    // day of month: require 26th / on 26 (not bare 11 from 11:15)
    const dayM = clause.match(/\b(?:on\s+)?(?:the\s+)?(\d{1,2})(st|nd|rd|th)\b/i)
      || clause.match(/\bon\s+(?:the\s+)?(\d{1,2})\b/i);
    if(!dayM) continue;
    const dateStr = resolveDay(dayM[1]);
    if(!dateStr) continue;
    const times = parseTimeIn(clause);
    if(!times) continue;
    let title = clause
      .replace(/\b(?:on\s+)?(?:the\s+)?(\d{1,2})(?:st|nd|rd|th)?\b/gi, ' ')
      .replace(/\b(\d{1,2}):(\d{2})\s*(am|pm)?\b/gi, ' ')
      .replace(/\b(?:at\s+)?(\d{1,2})\s*(am|pm)?\b/gi, ' ')
      .replace(/\b(on|at|the|and|to)\b/gi, ' ')
      .replace(/\b(st|nd|rd|th)\b/gi, ' ')
      .replace(/[.,]+/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
    if(!title && carryTitle) title = carryTitle;
    if(title) carryTitle = title;
    title = title.replace(/[:\-–—]+$/g,'').trim();
    if(!title) title = 'Appointment';
    // day index for display compatibility + date for one-off
    const d = new Date(dateStr+'T12:00:00');
    const day = mondayIndex(d);
    results.push({
      title, day, start:times.start, end:times.end, room:'',
      scope:'session', date:dateStr, ambiguous:!!times.ambiguous, oneOff:true
    });
  }
  return results.length ? results : null;
}

function parseTimetableText(raw){
  const original = String(raw||'');
  // Excel grid if first lines contain 2+ time ranges (before Notion steals the text)
  const grid = parseExcelGridTimetable(original);
  if(grid && grid.length) return applySchoolHoursToResults(grid);
  const notion = parseNotionListTimetable(original);
  if(notion && notion.length) return applySchoolHoursToResults(notion);

  // Free-text path
  let src = original
    .replace(/[☐☑□■●○•]+/g, ' ')
    .replace(/\u00a0/g, ' ');
  // 11.15 → 11:15
  src = src.replace(/\b(\d{1,2})[.:](\d{2})\b/g, '$1:$2');
  src = src.replace(/\b(\d{1,2})([0-5]\d)\s*[-–—to]+\s*(\d{1,2})([0-5]\d)\b/g, (m,h1,m1,h2,m2)=>{
    if(parseInt(h1,10)>23||parseInt(h2,10)>23) return m;
    return h1+':'+m1+'-'+h2+':'+m2;
  });
  raw = src;

  // Dated one-offs: "Gouri Assessment 11:15 on 26th and at 9 on 27th"
  const dated = parseDatedOneOffs(raw);
  if(dated && dated.length) return dated;

  // Supports:
  // Bio Mon/Thur 8.00 to 8.30, Chem 9 to 10 on Tue/Fri, Math 11 to 12 on all days
  // Mon 8:30-12:40 Intro to Physics room Lab 2
  const results = [];
  const chunks = String(raw||'')
    .split(/\n|;/)
    .flatMap(line => {
      // split on commas that are not inside numbers like 8.00
      return line.split(/,(?=\s*[A-Za-z])/);
    })
    .map(s => s.trim())
    .filter(Boolean);

  function parseDays(str){
    const s = str.toLowerCase();
    // "all days" / every day / daily — NOT "all day" (that means full-day duration)
    if(/\ball\s*days\b|\bevery\s*day\b|\bdaily\b/.test(s)) return [0,1,2,3,4,5,6];
    if(/\bweekdays?\b/.test(s)) return [0,1,2,3,4];
    const hits = [];
    const re = /\b(mon(?:days?)?|tue(?:s(?:days?)?)?|wed(?:nesdays?)?|thu(?:r(?:s(?:days?)?)?|rsdays?)?|fri(?:days?)?|sat(?:urdays?)?|sun(?:days?)?)\b/g;
    let m;
    while((m = re.exec(s))){
      const k = m[1].toLowerCase();
      if(k.startsWith('mon')) hits.push(0);
      else if(k.startsWith('tue')) hits.push(1);
      else if(k.startsWith('wed')) hits.push(2);
      else if(k.startsWith('thu')) hits.push(3);
      else if(k.startsWith('fri')) hits.push(4);
      else if(k.startsWith('sat')) hits.push(5);
      else if(k.startsWith('sun')) hits.push(6);
    }
    // Mon/Thu or Mon-Fri style already covered by re on each token; also split slashes
    return [...new Set(hits)];
  }

  function parseTimeToken(h, m, ap, preferPM){
    let hour = parseInt(h, 10);
    let min = m != null && m !== '' ? parseInt(m, 10) : 0;
    if(isNaN(hour)) return null;
    if(isNaN(min)) min = 0;
    const a = (ap||'').toLowerCase();
    let ambiguous = false;
    if(a === 'pm' && hour < 12) hour += 12;
    else if(a === 'am' && hour === 12) hour = 0;
    else if(!a){
      // No am/pm written → always ask the user later
      ambiguous = true;
      // Preview default: 1–6 afternoon (school), 7–11 morning, 12 noon
      if(preferPM !== false && hour >= 1 && hour <= 6) hour += 12;
    }
    if(hour > 23 || min > 59) return null;
    return { time: String(hour).padStart(2,'0') + ':' + String(min).padStart(2,'0'), ambiguous };
  }

  function parseTimes(str){
    const s = str.toLowerCase();
    if(/\b(all\s*day|whole\s*day|entire\s*day|full\s*day)\b/.test(s)){
      return {start:'08:00', end:'18:00', allDay:true, ambiguous:false};
    }
    let m = s.match(/\b(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\s*(?:-|–|—|to)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm)?\b/);
    if(m){
      const st = parseTimeToken(m[1], m[2], m[3]);
      const en = parseTimeToken(m[4], m[5], m[6] || m[3]);
      if(st && en) return {start:st.time, end:en.time, ambiguous: !!(st.ambiguous||en.ambiguous)};
    }
    m = s.match(/\b(\d{1,2})(?:[:.](\d{2}))\s*(am|pm)?\b/);
    if(m){
      const st = parseTimeToken(m[1], m[2], m[3]);
      if(st){
        const [hh, mm] = st.time.split(':').map(Number);
        const end = String((hh+1)%24).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
        return {start:st.time, end, ambiguous:st.ambiguous};
      }
    }
    m = s.match(/\b(\d{1,2})\s*(am|pm)?\b/);
    if(m){
      const st = parseTimeToken(m[1], '00', m[2]);
      if(st){
        const hh = parseInt(st.time.slice(0,2),10);
        const end = String((hh+1)%24).padStart(2,'0') + ':00';
        return {start:st.time, end, ambiguous:st.ambiguous};
      }
    }
    return null;
  }

  for(const chunk of chunks){
    const days = parseDays(chunk);
    const times = parseTimes(chunk);
    if(!times) continue;
    const useDays = days.length ? days : [0];

    let room = '';
    const roomM = chunk.match(/\broom\s*(?:no\.?|number|#)?\s*([A-Za-z0-9\-]+)/i)
      || chunk.match(/\b(?:hall|lab|rm)\s*([A-Za-z0-9\-]+)/i);
    if(roomM) room = roomM[1];

    let title = chunk
      .replace(/\b(mon(?:days?)?|tue(?:s(?:days?)?)?|wed(?:nesdays?)?|thu(?:r(?:s(?:days?)?)?|rsdays?)?|fri(?:days?)?|sat(?:urdays?)?|sun(?:days?)?)\b/gi, ' ')
      .replace(/\b(all\s*days?|every\s*day|daily|weekdays?|all\s*day|whole\s*day|entire\s*day|full\s*day|on|at|same\s*day|to|and)\b/gi, ' ')
      .replace(/\b\d{1,2}(?:[:.]\d{2})?\s*(am|pm)?(\s*(-|–|—|to)\s*\d{1,2}(?:[:.]\d{2})?\s*(am|pm)?)?/gi, ' ')
      .replace(/\broom\s*(?:no\.?|number|#)?\s*[A-Za-z0-9\-]+/gi, ' ')
      .replace(/\b(?:hall|lab|rm)\s*[A-Za-z0-9\-]+/gi, ' ')
      .replace(/[\/|,\.]+/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
    if(!title) title = times.allDay ? 'All-day class' : 'Class';

    for(const d of useDays){
      results.push({title, day:d, start:times.start, end:times.end, room, scope:'semester', ambiguous:!!times.ambiguous});
    }
  }
  return applySchoolHoursToResults(results);
}

      }).join('');
    })()}
  </div>`;
}

function buildProjectPhases(kind, stream, title){
  const meta=(PROJECT_STREAMS[kind]&&PROJECT_STREAMS[kind].streams[stream])||null;
  const guideSteps = meta && meta.steps ? meta.steps : [];
  const isAcad = kind==='academic';
  // Map discipline guide into Planning + Execution hints
  const planItems = guideSteps.length
    ? guideSteps.map(s=>({text: s.title+(s.hint?(' — '+s.hint):''), done:false, planned:false}))
    : (isAcad
      ? [{text:'Break professor rubric into checklist items',done:false,planned:false},{text:'Set internal milestones before hard deadline',done:false,planned:false},{text:'Assign who does what (even if solo: time blocks)',done:false,planned:false}]
      : [{text:'Define MVP (smallest shippable version)',done:false,planned:false},{text:'List weekly time boxes',done:false,planned:false},{text:'Pick one public accountability channel',done:false,planned:false}]);
  const execCards = guideSteps.length
    ? guideSteps.flatMap(s=>(s.items||[]).map(text=>({id:uid(), title:text, status:'todo', assignee:''})))
    : [{id:uid(), title:'First concrete work block', status:'todo', assignee:''}];
  return [
    {
      id:'initiation', title:'1. Initiation', short:'Setup',
      blurb: isAcad ? 'Topic, course, due date, team (if group).' : 'Goal, constraints, and who is involved.',
      items: isAcad
        ? [{text:'Confirm topic / project prompt',done:false},{text:'Note course & professor',done:false},{text:'Confirm hard deadline',done:false},{text:'Team roles clear (or solo confirmed)',done:false}]
        : [{text:'Write one-sentence goal',done:false},{text:'Define success metric',done:false},{text:'Confirm target date (if any)',done:false},{text:'Team or solo confirmed',done:false}]
    },
    {
      id:'planning', title:'2. Planning', short:'Plan',
      blurb: 'Break work down. Checking a box here means “in the plan” — not finished yet.',
      items: planItems,
      planningMode: true
    },
    {
      id:'execution', title:'3. Execution', short:'Do',
      blurb: 'Move work across the board. Shared links and drafts live here.',
      items: [],
      board: execCards,
      resources: []
    },
    {
      id:'monitoring', title:'4. Monitoring', short:'Check',
      blurb: isAcad ? 'Panic control: progress, stuck work, days left.' : 'Scope, energy, and target date health.',
      items: isAcad
        ? [{text:'Review progress vs internal milestones',done:false},{text:'Flag anything stuck / needs help',done:false},{text:'Ping teammates on missed mini-deadlines',done:false}]
        : [{text:'Check for scope creep',done:false},{text:'Honest energy / burnout check',done:false},{text:'Adjust MVP if needed',done:false}]
    },

        : [{text:'Ship / publish / launch MVP',done:false},{text:'Write short post-mortem',done:false},{text:'Save artifacts to portfolio',done:false},{text:'Mark project complete',done:false}]
    }
  ];
}


function projectSummaryText(p){
  if(!p) return '';
  const pct=projectProgress(p);
  const lines=[];
  lines.push('SnapBack Project: '+(p.title||''));
  lines.push((p.kind==='academic'?'Academic':'Non-academic')+' · '+(p.teamMode==='group'?'Group':'Individual'));
  if(p.stream) lines.push('Stream: '+p.stream);
  if(p.subject) lines.push('Subject: '+p.subject);
  if(p.courseName) lines.push('Course: '+p.courseName);
  if(p.professor) lines.push('Professor: '+p.professor);
  if(p.deadline) lines.push('Deadline: '+p.deadline);
  if(p.prompt) lines.push('Prompt: '+p.prompt);
  lines.push('Progress: '+pct+'%');
  lines.push('');
  if(p.selfMember && (p.selfMember.name||p.selfMember.responsibilities)){
    lines.push('You: '+(p.selfMember.name||'')+(p.selfMember.role?(' ('+p.selfMember.role+')'):''));
    if(p.selfMember.responsibilities) lines.push('  Responsibilities: '+p.selfMember.responsibilities);
    if(p.selfMember.deadline) lines.push('  Deadline: '+p.selfMember.deadline);
    lines.push('');
  }
  if(p.team && p.team.length){
    lines.push('Team:');
    p.team.forEach(m=>{
      lines.push('- '+(m.name||'')+(m.role?(' ('+m.role+')'):''));
      if(m.responsibilities) lines.push('  Responsibilities: '+m.responsibilities);
      if(m.deadline) lines.push('  Deadline: '+m.deadline);
      if(m.email||m.phone) lines.push('  '+(m.email||'')+(m.phone?(' · '+m.phone):''));
    });
    lines.push('');
  }
  (p.phases||[]).forEach((ph,i)=>{
    lines.push('Phase '+(i+1)+': '+(ph.title||''));
    (ph.items||[]).forEach(it=>{
      const mark = it.done ? '[x]' : (it.planned ? '[plan]' : '[ ]');
      lines.push('  '+mark+' '+(it.text||''));
    });
    (ph.board||[]).forEach(c=>{
      lines.push('  ['+(c.status||'todo')+'] '+(c.title||''));
    });
    lines.push('');
  });
  if(p.customItems && p.customItems.length){
    lines.push('Custom points:');
    p.customItems.forEach(it=>lines.push('  '+(it.done?'[x]':'[ ]')+' '+(it.text||'')));
    lines.push('');
  }
  if(p.resources && p.resources.length){
    lines.push('Resources:');
    p.resources.forEach(u=>lines.push('  '+u));
  }
  lines.push('');
  lines.push('Shared from SnapBack');
  return lines.join('\n');
}
function downloadProjectPdf(p){
  if(!p) return;
  const text=projectSummaryText(p);
  const filename='snapback-project-'+(String(p.title||'project').replace(/[^\w\-]+/g,'-').slice(0,40))+'.pdf';
  try{
    const pdf=buildSimplePdf(text);
    const blob=new Blob([pdf],{type:'application/pdf'});
    try{
      const FS=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Filesystem;
      const Share=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Share;
      if(FS){
        const b64=btoa(String.fromCharCode.apply(null, new Uint8Array(pdf)));
        FS.writeFile({path:filename, data:b64, directory:'DOCUMENTS', recursive:true}).then(async function(res){
          if(Share){
            try{ await Share.share({title:p.title||'Project', url:res.uri, dialogTitle:'Share project PDF'}); }catch(e){}
          }
          showAppMessage('PDF saved', filename+' in app documents. You can share it from the system share sheet if shown.');
        }).catch(function(){ triggerBrowserDownload(blob, filename); });
        return;
      }
    }catch(e){}
    triggerBrowserDownload(blob, filename);
  }catch(e){
    // fallback plain text
    const blob=new Blob([text],{type:'text/plain'});
    triggerBrowserDownload(blob, filename.replace(/\.pdf$/,'.txt'));
    showAppMessage('Downloaded as text', 'PDF helper failed; saved a text summary instead.');
  }
}
function triggerBrowserDownload(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.rel='noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ try{URL.revokeObjectURL(url); a.remove();}catch(e){} }, 1500);
  showAppMessage('Download started', filename);
}

function projectProgress(p){
  if(!p) return 0;
  let total=0, done=0;
  const phases=p.phases||[];
  if(phases.length){
    phases.forEach(ph=>{
      (ph.items||[]).forEach(it=>{ total++; if(it.done) done++; });
      (ph.board||[]).forEach(c=>{ total++; if(c.status==='done') done++; });
    });
  } else if(p.steps){
    p.steps.forEach(s=>{(s.items||[]).forEach(it=>{ total++; if(it.done) done++; });});
  }
  (p.customItems||[]).forEach(it=>{ total++; if(it.done) done++; });
  return total? Math.round(100*done/total):0;
}

    <button class="btn" data-action="proj-generate" style="margin-top:16px;width:100%">Generate my guide</button>

function viewProjectDetail(p){
  // Migrate old projects (steps only) into phases once
  if((!p.phases || !p.phases.length) && p.steps && p.steps.length){
    p.phases = buildProjectPhases(p.kind||'academic', p.stream||'sciences', p.title||'');
    p.phaseIndex = 0;
  }
  if(!p.phases) p.phases = buildProjectPhases(p.kind||'academic', p.stream||'sciences', p.title||'');
  const pct=projectProgress(p);
  const phases=p.phases||[];
  const pi=Math.min(Math.max(0, p.phaseIndex||0), Math.max(0, phases.length-1));
  const ph=phases[pi]||{title:'',items:[],blurb:''};
  const streamMeta=(PROJECT_STREAMS[p.kind]&&PROJECT_STREAMS[p.kind].streams[p.stream])||{};
  let daysLeft='';
  if(p.deadline){
    try{
      const d=Math.round((new Date(p.deadline+'T12:00:00')-new Date(todayStr()+'T12:00:00'))/86400000);
      daysLeft = d>=0 ? (d+' day(s) left') : ('Due '+Math.abs(d)+' day(s) ago');
    }catch(e){}
  }
  const isPlan = ph.planningMode || ph.id==='planning';
  const board = ph.board || [];
  const col = (status, label) => {
    const cards = board.filter(c=>c.status===status);
    return `<div style="flex:1;min-width:140px;background:var(--bg);border-radius:12px;padding:10px;border:1px solid var(--line)">
      <div style="font-size:.72rem;font-weight:800;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${label} (${cards.length})</div>
      ${cards.map(c=>`<div class="card" style="padding:10px;margin-bottom:8px;background:var(--card)">
        <div style="font-weight:600;font-size:.9rem">${escapeHtml(c.title)}</div>
        <div class="row" style="gap:4px;margin-top:8px;flex-wrap:wrap">
          ${['todo','doing','review','done'].filter(s=>s!==c.status).map(s=>`<button type="button" class="btn ghost sm" style="font-size:.68rem;padding:2px 6px" data-action="proj-board-move" data-id="${c.id}" data-status="${s}">${s==='todo'?'To do':s==='doing'?'Doing':s==='review'?'Review':'Done'}</button>`).join('')}
        </div>
      </div>`).join('')||'<div style="font-size:.78rem;color:var(--muted)">Empty</div>'}
    </div>`;
  };

  return `<div class="pagehead">
    <button class="btn ghost sm" data-action="close-project" style="margin-bottom:8px">← All projects</button>
    <div class="eyebrow">${p.kind==='academic'?'🎓 Academic':'🚀 Non-academic'} · ${p.teamMode==='group'?'Group':'Individual'}${streamMeta.label? ' · '+escapeHtml(streamMeta.label):''}</div>

    <p style="margin:0;color:var(--muted);font-size:.9rem">
      ${p.deadline?('Due '+escapeHtml(p.deadline)+(daysLeft? ' · '+daysLeft:'')):'No deadline set'}

    ${(p.team||[]).map((m,mi)=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">

      ${state.projectTeamEditIdx===mi?`<div style="margin-top:10px;padding:12px;background:var(--bg);border-radius:12px">

    </div>`).join('')||'<div class="empty" style="margin-bottom:8px">No teammates yet — add below.</div>'}
    ${state.projectTeamAdding?`<div style="margin-top:10px;padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--line)">

      <input id="ptNewRole" placeholder="Role" style="width:100%;margin-bottom:6px">

  </div>

  <div class="card" style="padding:10px">

      ${phases.map((phx,i)=>`<button type="button" class="btn ${i===pi?'':'ghost'} sm" data-action="proj-phase" data-idx="${i}" style="flex:1;min-width:72px;text-align:center;padding:8px 6px">
        <div style="font-size:.68rem;opacity:.8">${i+1}</div>

  <div class="card" style="border-left:4px solid var(--pine)">
    <div style="font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em">Active phase</div>
    <h2 style="margin:6px 0 4px;font-size:1.15rem;line-height:1.3">${escapeHtml(ph.title)}</h2>
    ${ph.blurb?`<p style="font-size:.88rem;color:var(--muted);margin:0 0 14px;line-height:1.45">${escapeHtml(ph.blurb)}</p>`:''}

    <div style="font-size:.8rem;background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;padding:8px 10px;margin-bottom:12px">Tap a step to open a notes box. <b>Save</b> your details. Use <b>Mark step done</b> only when that step is finished — it will not strike through just from opening it.</div>

    ${(ph.items||[]).length? (ph.items||[]).map((it,ii)=>{

        </div>

    ${ph.id==='monitoring'?`

        <div style="margin-top:8px;height:8px;background:var(--line);border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${pct<40?'var(--brick)':pct<75?'#c9a227':'var(--pine)'}"></div></div>
      </div>

    <div class="row" style="margin-top:16px;gap:8px">
      <button class="btn ghost" data-action="proj-phase" data-idx="${Math.max(0,pi-1)}" ${pi<=0?'disabled':''}>← Previous phase</button>
      <button class="btn" data-action="proj-phase" data-idx="${Math.min(phases.length-1,pi+1)}" style="flex:1">${pi>=phases.length-1?'Stay on Closure':'Next phase →'}</button>

  </div>

  <div class="card" style="border-left:4px solid #25D366">

      <button type="button" class="btn" data-action="proj-pdf">Download PDF summary</button>
      <button type="button" class="btn" data-action="proj-wa" style="background:#25D366;border-color:#25D366">Send on WhatsApp</button>

  <div class="card">
    <div style="font-weight:700;margin-bottom:6px">Your custom points</div>

function fillPlateFromTasks(){
  const open=(state.tasks||[]).filter(t=>!t.done && !t.backburner).slice(0,9);

function buildSimplePdf(text){
  // Minimal single-page PDF with Helvetica text (ASCII-safe)
  const lines = String(text||'').split(/\r?\n/);
  const esc = (s)=>String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  let y = 800;
  const content = ['BT','/F1 11 Tf','14 TL','50 '+y+' Td'];
  lines.slice(0,120).forEach((line,i)=>{
    const L = esc(line.slice(0,90));
    if(i===0) content.push('('+L+') Tj');
    else content.push('T* ('+L+') Tj');
  });
  content.push('ET');
  const stream = content.join('\n');
  const objs = [];
  objs.push('1 0 obj<< /Type /Catalog /Pages 2 0 R >>endobj\n');
  objs.push('2 0 obj<< /Type /Pages /Kids [3 0 R] /Count 1 >>endobj\n');
  objs.push('3 0 obj<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources<< /Font<< /F1 5 0 R >> >> >>endobj\n');
  objs.push('4 0 obj<< /Length '+stream.length+' >>stream\n'+stream+'\nendstream\nendobj\n');
  objs.push('5 0 obj<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>endobj\n');
  let body = '%PDF-1.3\n';
  const offsets = [0];
  objs.forEach(o=>{ offsets.push(body.length); body += o; });
  const xref = body.length;
  body += 'xref\n0 '+(objs.length+1)+'\n';
  body += '0000000000 65535 f \n';
  for(let i=1;i<offsets.length;i++) body += String(offsets[i]).padStart(10,'0')+' 00000 n \n';
  body += 'trailer<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  return body;
}
async function downloadJournalBucket(bucket){
  if(!state.journalFiled) state.journalFiled={file:[],do:[],drop:[]};
  let list=(state.journalFiled[bucket])||[];
  // Also include unfiled notes if bucket empty so download is never blank by surprise
  if(!list.length && state.journal && state.journal.length){
    list = state.journal.map(e=>({date:e.date||'', time:e.time||'', text:e.text||''}));
  }
  const lines=list.map(e=>`${e.date||''} ${e.time||''}\n${e.text||''}\n---`).join('\n') || '(No journal entries yet.)';
  const filename='snapback-journal-'+bucket+'.pdf';
  const pdfText = 'SnapBack Journal — '+bucket+'\n\n'+lines;
  try{
    const pdf = buildSimplePdf(pdfText);
    const blob = new Blob([pdf], {type:'application/pdf'});
    // Capacitor Filesystem → app documents (real file on phone)
    try{
      const FS = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
      if(FS && typeof FS.writeFile==='function'){
        const b64 = btoa(unescape(encodeURIComponent(pdf)));
        await FS.writeFile({ path: filename, data: b64, directory: 'DOCUMENTS', recursive: true });
        showAppMessage('PDF saved', filename+' saved in app Documents. Open Files/Documents to view or share it.');
        return;
      }
    }catch(e){ console.warn('fs write', e); }
    // Browser / WebView download link
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=filename;
    a.rel='noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ URL.revokeObjectURL(a.href); a.remove(); }catch(e){} }, 800);
    showAppMessage('PDF download', filename+' — check your Downloads folder.');
  }catch(e){
    console.warn(e);
    showAppMessage('Download failed', String(e&&e.message||e));
  }
}

function needsDistance(focus){
  const f=String(focus||'').toLowerCase();

function nextDateForDow(dow){

function exerciseTaskTitle(r){
  const bits=[r.focus||'Exercise'];
  if(r.details) bits.push(r.details);
  if(r.km) bits.push(String(r.km)+' km');
  return bits.join(' · ');
}
function normExTitle(s){
  return String(s||'').toLowerCase().replace(/^workout:\s*/,'').replace(/\s+/g,' ').trim();
}
function collapseWorkoutCopies(){
  if(!Array.isArray(state.exercisePlan)) state.exercisePlan=[];
  if(!Array.isArray(state.studyBlocks)) state.studyBlocks=[];
  state.exercisePlan.forEach(function(r){ if(!r.id) r.id=uid(); });
  let dirty=false;
  const groups={};
  state.exercisePlan.forEach(function(r){
    const key=String(r.day)+'|'+normExTitle(exerciseTaskTitle(r))+'|'+String(r.onceDate||'')+'|'+String(r.from||'')+'|'+String(r.to||'');
    if(!groups[key]) groups[key]=[];
    groups[key].push({kind:'plan', row:r, start:String(r.start||'')});
  });
  state.studyBlocks.forEach(function(b){
    let dow=null;
    try{ dow=mondayIndex(new Date((b.date||'')+'T12:00:00')); }catch(e){}
    if(dow==null || !b.date) return;
    const key=String(dow)+'|'+normExTitle(b.label);
    if(!groups[key]) return;
    groups[key].push({kind:'block', row:b, start:String(b.start||'')});
  });
  Object.keys(groups).forEach(function(key){
    const arr=groups[key];
    if(arr.length<2) return;
    dirty=true;
    arr.sort(function(a,b){ return a.start.localeCompare(b.start); });
    const keep=arr[arr.length-1];
    const plansIn=arr.filter(function(x){ return x.kind==='plan'; });
    if(plansIn.length){
      const survivor=plansIn[plansIn.length-1].row;
      if(String(keep.start)>String(survivor.start||'')){
        survivor.start=keep.kind==='plan'?keep.row.start:keep.row.start;
        survivor.end=keep.kind==='plan'?keep.row.end:(keep.row.end||survivor.end);
      }
      const sid=String(survivor.id);
      state.exercisePlan=state.exercisePlan.filter(function(r){
        const k=String(r.day)+'|'+normExTitle(exerciseTaskTitle(r))+'|'+String(r.onceDate||'')+'|'+String(r.from||'')+'|'+String(r.to||'');
        if(k!==key) return true;
        return String(r.id)===sid;
      });
    }
    const drop={};
    arr.forEach(function(x){ if(x.kind==='block') drop[String(x.row.id)]=1; });
    if(Object.keys(drop).length){
      state.studyBlocks=state.studyBlocks.filter(function(b){ return !drop[String(b.id)]; });
    }
  });
  if(dirty){ try{ saveState(); }catch(e){} }
}
function syncExerciseLinks(){
  collapseWorkoutCopies();
  ensureHabitPlans();
  const ids={};
  (state.exercisePlan||[]).forEach(function(r){
    if(!r.id) r.id=uid();
    ids[String(r.id)]=1;
    const title=exerciseTaskTitle(r);
    const date=nextExerciseDate(r);
    if(!date){
      state.tasks=(state.tasks||[]).filter(function(t){ return !(String(t.exerciseId)===String(r.id) && !t.done); });
      return;
    }
    let t=(state.tasks||[]).find(function(x){ return String(x.exerciseId)===String(r.id) && !x.done; });
    if(!t){
      t={id:uid(), title:title, notes:r.details||'', date:date, time:r.start||'', priority:'medium', urgent:false, important:false, tier:'could', frog:false, context:'personal', meetingUrl:'', reminderLeads:[], reminderTime:'', startDate:'', startTime:'', startReminderMinutes:[], chunks:[], pomodoros:0, done:false, whenThen:{}, rewarding:{}, strategic:{}, flip:{}, exerciseId:r.id, created:Date.now()};
      if(!Array.isArray(state.tasks)) state.tasks=[];
      state.tasks.unshift(t);
    } else {
      t.title=title;
      t.notes=r.details||'';
      t.time=r.start||'';
      if(!t.done) t.date=date;
      t.exerciseId=r.id;
    }
    r.taskId=t.id;
  });
  state.tasks=(state.tasks||[]).filter(function(t){ return !t.exerciseId || ids[String(t.exerciseId)]; });
  const sig=todayStr()+'|'+(state.exercisePlan||[]).map(function(r){ return [r.id,r.day,r.start,r.end,r.focus,r.details,r.km,r.taskId].join(':'); }).join(';');
  if(state._exSig!==sig){

  }
}

    return `<div style="position:absolute;left:${n.x-72}px;top:${n.y-16}px;width:144px;text-align:center;z-index:2">
      <input value="${escapeHtml(n.text)}" data-action="mm-set-text" data-id="${n.id}" style="width:100%;text-align:center;font-weight:${isRoot?'700':'600'};font-size:${isRoot?'.9rem':'.8rem'};border-radius:10px;border:1px solid var(--line);padding:5px 7px;background:${isRoot?'var(--pine)':'#fff'};color:${isRoot?'#fff':'var(--ink)'}">
      <div style="margin-top:3px">
        <button data-action="mm-add-child" data-id="${n.id}" style="border:1px dashed #C9C2B0;background:none;border-radius:999px;padding:1px 8px;font-size:.68rem;cursor:pointer;color:var(--muted)">+ branch</button>
        ${!isRoot?`<button data-action="mm-delete-node" data-id="${n.id}" style="border:none;background:none;color:var(--brick);font-size:.7rem;cursor:pointer;margin-left:4px">&#10005;</button>`:''}
      </div>
    </div>`;
  }).join('');
  return `
  <div class="pagehead">
    <button class="btn ghost sm" data-action="mm-back">&larr; All mind maps</button>
    <h1>${escapeHtml(map.title)}</h1>
    <p>Click "+ branch" under any bubble to add a connected idea. Click into any bubble's text to rename it.</p>
  </div>
  <div class="card" style="overflow:auto">
    ${(function(){
      const avail = (typeof window!=='undefined' && window.innerWidth) ? window.innerWidth - 70 : MM_W;
      const scale = Math.min(1, avail/MM_W);
      return `<div style="position:relative;width:${MM_W*scale}px;height:${MM_H*scale}px;margin:0 auto">
      <div style="position:absolute;left:0;top:0;width:${MM_W}px;height:${MM_H}px;transform:scale(${scale});transform-origin:top left">
        <svg width="${MM_W}" height="${MM_H}" style="position:absolute;left:0;top:0;z-index:1">${lines}</svg>
        ${nodesHtml}
      </div>
    </div>`;
    })()}
  </div>`;
}

function loggedHabitValue(h, d){
  const direct = state.habitLog && state.habitLog[d] ? state.habitLog[d][h.id] : undefined;
  if(direct!=null && direct!=='') return direct;
  if(/sleep/i.test(h.name||'') && state.sleepLog && state.sleepLog[d]!=null && state.sleepLog[d]!==''){
    const n=parseFloat(String(state.sleepLog[d]));
    return isNaN(n) ? state.sleepLog[d] : n;
  }
  if(/meal/i.test(h.name||'') && state.mealLog && (state.mealLog[d]===true || state.mealLog[d]===false)) return !!state.mealLog[d];
  return undefined;
}
function statTaskLines(list, kind){
  const shown=list.slice(0,5);
  if(!shown.length) return '<div class="empty">None.</div>';
  const rows=shown.map(function(t){
    const badge = kind==='done' ? '<span class="badge low">done</span>' : '<span class="badge '+(isOverdue(t)?'overdue':'medium')+'">'+(isOverdue(t)?'overdue':'not done')+'</span>';
    return '<div class="deadline-row">'+badge+'<span style="flex:1">'+escapeHtml(t.title)+'</span></div>';
  }).join('');
  const more=list.length-shown.length;
  return rows+(more?'<p style="font-size:.82rem;color:var(--muted);margin:8px 0 0">'+more+' more. The count above is the full number.</p>':'');
}
function viewStats(){
  const start=state.statsRangeStart, end=state.statsRangeEnd;
  const days=dateRangeArray(start,end);

  const tasksInRange=state.tasks.filter(t=>t.date && t.date>=start && t.date<=end);
  const completed=tasksInRange.filter(t=>t.done);
  const leftOut=tasksInRange.filter(t=>!t.done);

  const focusSessions=days.reduce((sum,d)=>sum+(state.focusSessionLog[d]||0),0);
  const focusMinutes=focusSessions*(state.settings.workMin||25);

  const habitLines=statsHabitLines(days);

  const moneyInRange=state.money.filter(m=>m.date>=start && m.date<=end);
  const spent=moneyInRange.filter(m=>m.type==='expense').reduce((a,b)=>a+b.amount,0);
  const earned=moneyInRange.filter(m=>m.type==='income').reduce((a,b)=>a+b.amount,0);

  return `
  <div class="pagehead"><button class="btn ghost sm" data-action="go-back" style="margin-bottom:8px">← Back</button><div class="eyebrow">Zoom out and see the shape of it</div><h1>Stats</h1><p>Counts for the dates you pick. The task list stays on Tasks.</p></div>

  <div class="card">
    <div class="row">
      <div class="field"><label>From</label><input type="date" id="statsStart" value="${start}"></div>
      <div class="field"><label>To</label><input type="date" id="statsEnd" value="${end}"></div>
      <button class="btn ghost sm" id="applyStatsRangeBtn" style="flex:0 0 auto;align-self:flex-end">Apply</button>
    </div>
  </div>

  <div class="grid3">
    <div class="statbox"><div class="lbl">Tasks completed</div><div class="val" style="color:var(--pine)">${completed.length}</div></div>
    <div class="statbox"><div class="lbl">Left undone</div><div class="val" style="color:var(--brick)">${leftOut.length}</div></div>
  </div>

  <div class="card">
    <h3>Focus and habits</h3>
    <div class="moneystats" style="margin-bottom:10px">
      <div class="statbox"><div class="lbl">Focus sessions</div><div class="val">${focusSessions}</div></div>
      <div class="statbox"><div class="lbl">Minutes</div><div class="val">${focusMinutes}</div></div>
      <div class="statbox"><div class="lbl">Finished sessions</div><div class="val" style="color:var(--pine)">${state.stats.treesGrown||0}</div></div>
    </div>
    <p style="font-size:.85rem;color:var(--muted);margin:0 0 12px">Sessions and minutes are for the dates above. Finished sessions is the full count, including older days.</p>
    ${habitLines.length?habitLines.map(h=>`<div class="deadline-row"><span>${escapeHtml(h.name)}</span><span style="flex:1;text-align:right;color:var(--muted);font-size:.85rem">${escapeHtml(h.summary)}</span></div>`).join(''):'<p style="color:var(--muted);margin:0">No habit answers in this range.</p>'}
  </div>

  <div class="card">
    <h3>Money</h3>
    <div class="moneystats">
      <div class="statbox"><div class="lbl">Spent</div><div class="val" style="color:var(--brick)">₹${spent.toFixed(0)}</div></div>
      <div class="statbox"><div class="lbl">Received</div><div class="val" style="color:var(--pine)">₹${earned.toFixed(0)}</div></div>
      <div class="statbox"><div class="lbl">Net</div><div class="val">₹${(earned-spent).toFixed(0)}</div></div>
    </div>

  `;
}

function saveShareContactsFromForm(){
